<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logiciel Planning Shift B - Version Expert+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f3f4f6; font-family: system-ui, sans-serif; font-size: 0.82rem; }
        .tab-btn.active { background-color: #1a237e; color: white; border-bottom: 4px solid #facc15; }
        .tab-btn { background-color: #e5e7eb; color: #4b5563; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; text-align: center; }
        th, td { border: 1px solid #d1d5db; padding: 4px; }
        .sticky-col { position: sticky; left: 0; background-color: white; z-index: 20; text-align: left; border-right: 2px solid #000 !important; min-width: 170px; }
        .cell-AMU { background-color: #fef08a; } .cell-BAT { background-color: #93c5fd; }
        .cell-BAL { background-color: #86efac; } .cell-CH { background-color: #fdba74; }
        .cell-CDD { background-color: #fca5a5; } .cell-POLY { background-color: #d8b4fe; }
        .role-select { width: 100%; border: none; background: transparent; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-[98%] mx-auto mb-6 bg-white rounded-xl shadow-lg p-4 flex justify-between items-center border-b-4 border-[#1a237e]">
        <div>
            <h1 class="text-2xl font-bold text-[#1a237e]">Planning Shift B 🚒</h1>
            <p class="text-gray-500 font-medium italic">Rotation intelligente & Limitation CDD active</p>
        </div>
        <div class="flex gap-2">
            <button onclick="switchTab('planning')" id="btn-tab-planning" class="tab-btn active px-6 py-2 rounded-t-lg font-bold">📅 PLANNING</button>
            <button onclick="switchTab('agents')" id="btn-tab-agents" class="tab-btn px-6 py-2 rounded-t-lg font-bold">👥 AGENTS & SKILLS</button>
        </div>
    </div>

    <div class="max-w-[98%] mx-auto">
        <div id="view-planning" class="space-y-6">
            <div class="bg-white rounded-xl shadow-md p-4 border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">1️⃣ Présences</h2>
                    <input type="month" id="month-input" class="border-2 border-[#1a237e] rounded-lg p-2 font-bold" onchange="changeMonth()">
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-300" style="max-height: 50vh;">
                    <table id="table-pointage">
                        <thead id="thead-pointage"></thead>
                        <tbody id="tbody-pointage"></tbody>
                        <tfoot id="tfoot-pointage" class="bg-gray-100 font-bold"></tfoot>
                    </table>
                </div>
                <div class="mt-4 flex justify-end">
                    <button onclick="generatePlanning()" class="bg-[#1a237e] hover:bg-blue-800 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-all">⚙️ GÉNÉRER LA ROTATION</button>
                </div>
            </div>

            <div id="result-container" class="hidden bg-white rounded-xl shadow-md p-4 border-2 border-green-500">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">2️⃣ Planning Final</h2>
                    <div class="flex gap-3">
                        <button onclick="exportToExcel()" class="bg-gray-700 text-white px-4 py-2 rounded-lg font-bold">📥 EXPORT EXCEL</button>
                        <button onclick="saveData(true)" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold">💾 SAUVEGARDER</button>
                    </div>
                </div>
                <div class="overflow-x-auto border border-gray-400 rounded-lg">
                    <table id="table-resultat">
                        <thead id="thead-resultat"></thead>
                        <tbody id="tbody-resultat"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-agents" class="hidden bg-white rounded-xl shadow-md p-6 border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Base Agents</h2>
                <button onclick="addAgent()" class="bg-green-600 text-white px-5 py-2 rounded-lg font-bold shadow">➕ Ajouter</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-800 text-white text-[10px]">
                            <th class="p-2 sticky-col">NOM</th>
                            <th>TYPE</th>
                            <th>CDD</th>
                            <th>AMU</th>
                            <th>BAT</th>
                            <th>BAL</th>
                            <th>CH</th>
                            <th class="bg-purple-900">POLY</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-agents"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
// --- CONFIG FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyC1LrPXQ-j8rjf5LCzrJY4fZbxAS5i8kRc",
    authDomain: "planning-shift-b.firebaseapp.com",
    projectId: "planning-shift-b",
    storageBucket: "planning-shift-b.firebasestorage.app",
    messagingSenderId: "501907753582",
    appId: "1:501907753582:web:802533825145d5d65fb47f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("planning_data").doc("shift_b_shared");

const rolesListe = ["-", "CDD", "CH-PL", "AMU1-CH", "AMU1-EQ", "AMU2-CH", "AMU2-EQ", "BAT1", "BAT2", "BAL1", "BAL2", "POLY"];
let state = { agents: [], presences: {}, month: "2026-05", dates: [], planning: {} };

function getSortedAgents() {
    return [...state.agents].sort((a, b) => {
        if (a.isPro !== b.isPro) return a.isPro ? -1 : 1;
        return a.name.localeCompare(b.name);
    });
}

async function saveData(withAlert = false) {
    calculateCounters();
    await docRef.set(state);
    if(withAlert) alert("✅ Changements enregistrés !");
}

function loadData() {
    docRef.onSnapshot((doc) => {
        if (doc.exists) {
            state = { ...state, ...doc.data() };
            document.getElementById('month-input').value = state.month;
            updateDates();
            if(Object.keys(state.planning || {}).length > 0) {
                document.getElementById('result-container').classList.remove('hidden');
                renderResult();
            }
            if (!document.getElementById('view-agents').classList.contains('hidden')) renderAgents();
        }
    });
}

function calculateCounters() {
    state.agents.forEach(a => a.counters = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 });
    Object.values(state.planning || {}).forEach(day => {
        ['J', 'N'].forEach(shift => {
            if(day[shift]) {
                Object.entries(day[shift]).forEach(([agentId, role]) => {
                    const agent = state.agents.find(ag => ag.id === agentId);
                    if(agent && role !== "-") {
                        if(role === "CDD") agent.counters.CDD++;
                        else if(role.includes("AMU")) agent.counters.AMU++;
                        else if(role.includes("BAT")) agent.counters.BAT++;
                        else if(role.includes("BAL")) agent.counters.BAL++;
                        else if(role.includes("CH")) agent.counters.CH++;
                        else if(role === "POLY") agent.counters.POLY++;
                    }
                });
            }
        });
    });
}

// --- COEUR DE L'ALGORITHME DE ROTATION ---
function generatePlanning() {
    let newPl = {};
    let historicalRoles = {}; // Pour suivre la rotation des pros

    state.dates.forEach((d, dateIdx) => {
        const dKey = d.toISOString();
        newPl[dKey] = { J: {}, N: {} };
        
        ['J', 'N'].forEach(shift => {
            let pool = getSortedAgents().filter(a => state.presences[`${a.id}_${dKey}_${shift}`]);
            let assignments = {};
            let rolesOccupied = [];

            // 1. CDD (MAX 1 PAR GARDE)
            let cddAgent = pool.find(a => a.cap.CDD);
            if(cddAgent) {
                assignments[cddAgent.id] = "CDD";
                rolesOccupied.push("CDD");
            }

            // 2. CHAUFFEURS (Priorité Pro / Maintien 24h / Rotation)
            let chCandidate = pool.find(a => {
                if(!a.cap.CH || assignments[a.id]) return false;
                // Si Pro, on vérifie s'il l'a fait récemment (rotation)
                if(a.isPro) {
                    let lastRoles = historicalRoles[a.id] || [];
                    return !lastRoles.includes("CH-PL");
                }
                return true;
            }) || pool.find(a => a.cap.CH && !assignments[a.id]);

            if(chCandidate) {
                // Maintien 24h si possible
                if(shift === 'N' && newPl[dKey]['J'][chCandidate.id] === 'CH-PL') {
                    assignments[chCandidate.id] = "CH-PL";
                } else if (!rolesOccupied.includes("CH-PL")) {
                    assignments[chCandidate.id] = "CH-PL";
                }
            }

            // 3. AMU (Priorité Volontaire qualifié -> Rotation Pro)
            let rolesAMU = ["AMU1-CH", "AMU1-EQ", "AMU2-CH", "AMU2-EQ"];
            rolesAMU.forEach(role => {
                let candidate = pool.find(a => {
                    if(!a.cap.AMU || assignments[a.id]) return false;
                    if(role.includes("AMU1") && a.cap.CDD) return false; // CDD pas AMU1
                    
                    // Règle de non-doublon AMU Jour/Nuit
                    let alreadyAMU = (shift === 'N') ? (newPl[dKey]['J'][a.id] && newPl[dKey]['J'][a.id].includes("AMU")) : false;
                    if(alreadyAMU) return false;

                    if(a.isPro) {
                        let lastRoles = historicalRoles[a.id] || [];
                        return !lastRoles.includes(role.split('-')[0]); // Rotation simplifiée par type
                    }
                    return true; // Les volontaires sont prioritaires si trouvés en premier par find
                });
                if(candidate) assignments[candidate.id] = role;
            });

            // 4. BAT / BAL (Rotation Pro forcée)
            let rolesCombat = ["BAT1", "BAT2", "BAL1", "BAL2"];
            rolesCombat.forEach(role => {
                let candidate = pool.find(a => {
                    if(assignments[a.id]) return false;
                    if(a.isPro) {
                        let lastRoles = historicalRoles[a.id] || [];
                        return !lastRoles.includes(role.substring(0,3));
                    }
                    return true;
                }) || pool.find(a => !assignments[a.id]);

                if(candidate) assignments[candidate.id] = role;
            });

            // Remplissage final
            pool.forEach(a => { 
                if(!assignments[a.id]) assignments[a.id] = "POLY"; 
                // Mise à jour de l'historique pour la rotation des Pros (on garde les 4 derniers rôles)
                if(a.isPro) {
                    if(!historicalRoles[a.id]) historicalRoles[a.id] = [];
                    let r = assignments[a.id].split(/[0-9-]/)[0]; // On stocke la catégorie (AMU, BAT, etc.)
                    historicalRoles[a.id].push(r);
                    if(historicalRoles[a.id].length > 4) historicalRoles[a.id].shift();
                }
            });

            newPl[dKey][shift] = assignments;
        });
    });
    state.planning = newPl;
    saveData();
}

// --- REST DU CODE (INTERFACE) ---
function updateDates() { 
    const [y, m] = state.month.split('-'); 
    let ref = Date.UTC(2026, 3, 26);
    let dts = [];
    let d = new Date(Date.UTC(y, m-1, 1));
    while (d.getUTCMonth() === m-1) {
        if (Math.round((d.getTime() - ref) / 86400000) % 4 === 0) dts.push(new Date(d));
        d.setUTCDate(d.getUTCDate() + 1);
    }
    state.dates = dts; 
    renderPointage(); 
}

function renderPointage() {
    let thead1 = `<tr><th class="sticky-col">AGENT</th>`, thead2 = `<tr><th class="sticky-col"></th>`;
    let totals = { J: Array(state.dates.length).fill(0), N: Array(state.dates.length).fill(0) };
    state.dates.forEach((d, i) => {
        thead1 += `<th colspan="2" class="border-l border-gray-500">${d.getUTCDate()}/${d.getUTCMonth()+1}</th>`;
        thead2 += `<th class="text-[10px] bg-blue-900 text-white">J</th><th class="text-[10px] bg-indigo-900 text-white">N</th>`;
    });
    document.getElementById('thead-pointage').innerHTML = thead1 + "</tr>" + thead2 + "</tr>";
    
    let tbody = "";
    getSortedAgents().forEach(agent => {
        tbody += `<tr><td class="sticky-col font-bold border-r border-black bg-white flex justify-between ${agent.isPro?'text-blue-800':''}">
            <span>${agent.name}</span>
            <div><span class="text-green-600 cursor-pointer px-1" onclick="toggleFullMonth('${agent.id}', true)">+</span><span class="text-red-600 cursor-pointer px-1" onclick="toggleFullMonth('${agent.id}', false)">-</span></div>
        </td>`;
        state.dates.forEach((d, i) => {
            const iso = d.toISOString();
            if(state.presences[`${agent.id}_${iso}_J`]) totals.J[i]++;
            if(state.presences[`${agent.id}_${iso}_N`]) totals.N[i]++;
            tbody += `<td class="cursor-pointer" onclick="togglePresence('${agent.id}', '${iso}', 'J')"><input type="checkbox" ${state.presences[`${agent.id}_${iso}_J`] ? "checked":""} class="pointer-events-none"></td>
                      <td class="cursor-pointer bg-gray-50" onclick="togglePresence('${agent.id}', '${iso}', 'N')"><input type="checkbox" ${state.presences[`${agent.id}_${iso}_N`] ? "checked":""} class="pointer-events-none"></td>`;
        });
        tbody += "</tr>";
    });
    document.getElementById('tbody-pointage').innerHTML = tbody;
    let tfoot = `<tr><td class="sticky-col font-black bg-gray-200">TOTAL</td>`;
    totals.J.forEach((t, i) => tfoot += `<td class="bg-blue-50 font-bold">${t}</td><td class="bg-indigo-50 font-bold">${totals.N[i]}</td>`);
    document.getElementById('tfoot-pointage').innerHTML = tfoot + "</tr>";
}

function renderResult() {
    let thead = `<tr><th class="sticky-col">Agent</th>`;
    state.dates.forEach(d => thead += `<th colspan="2" class="border-l border-gray-600">${d.getUTCDate()}/${d.getUTCMonth()+1}</th>`);
    document.getElementById('thead-resultat').innerHTML = thead + "</tr>";
    let tbody = "";
    getSortedAgents().forEach(a => {
        tbody += `<tr><td class="sticky-col font-bold bg-gray-50 ${a.isPro?'text-blue-800':''}">${a.name}</td>`;
        state.dates.forEach(d => {
            const dKey = d.toISOString();
            ['J', 'N'].forEach(s => {
                const role = state.planning[dKey]?.[s]?.[a.id] || "-";
                let color = "";
                if(role.includes("AMU")) color="cell-AMU"; else if(role.includes("BAT")) color="cell-BAT";
                else if(role.includes("BAL")) color="cell-BAL"; else if(role.includes("CH")) color="cell-CH";
                else if(role==="CDD") color="cell-CDD"; else if(role==="POLY") color="cell-POLY";
                tbody += `<td class="${color}"><select class="role-select" onchange="state.planning['${dKey}']['${s}']['${a.id}']=this.value">
                    ${rolesListe.map(r => `<option value="${r}" ${role===r?'selected':''}>${r}</option>`).join('')}
                </select></td>`;
            });
        });
        tbody += `</tr>`;
    });
    document.getElementById('tbody-resultat').innerHTML = tbody;
}

function renderAgents() {
    let tbody = "";
    getSortedAgents().forEach(a => {
        const c = a.counters || { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 };
        const cap = a.cap || { CDD:false, AMU:false, BAT:false, BAL:false, CH:false };
        tbody += `<tr class="hover:bg-gray-50">
            <td class="p-1 border sticky-col bg-white font-bold ${a.isPro?'text-blue-700':''}">${a.name}</td>
            <td class="border"><select onchange="updateAgentField('${a.id}','isPro',this.value==='true')" class="text-xs p-1"><option value="true" ${a.isPro?'selected':''}>PRO</option><option value="false" ${!a.isPro?'selected':''}>VOL.</option></select></td>
            <td class="border bg-red-50"><input type="checkbox" ${cap.CDD?'checked':''} onchange="updateCap('${a.id}','CDD',this.checked)"><br><small>${c.CDD}</small></td>
            <td class="border bg-yellow-50"><input type="checkbox" ${cap.AMU?'checked':''} onchange="updateCap('${a.id}','AMU',this.checked)"><br><small>${c.AMU}</small></td>
            <td class="border bg-blue-50"><input type="checkbox" ${cap.BAT?'checked':''} onchange="updateCap('${a.id}','BAT',this.checked)"><br><small>${c.BAT}</small></td>
            <td class="border bg-green-50"><input type="checkbox" ${cap.BAL?'checked':''} onchange="updateCap('${a.id}','BAL',this.checked)"><br><small>${c.BAL}</small></td>
            <td class="border bg-orange-50"><input type="checkbox" ${cap.CH?'checked':''} onchange="updateCap('${a.id}','CH',this.checked)"><br><small>${c.CH}</small></td>
            <td class="border bg-purple-50 font-bold">${c.POLY}</td>
            <td class="border"><button onclick="deleteAgent('${a.id}')">❌</button></td>
        </tr>`;
    });
    document.getElementById('tbody-agents').innerHTML = tbody;
}

function togglePresence(id, iso, s) { state.presences[`${id}_${iso}_${s}`] = !state.presences[`${id}_${iso}_${s}`]; saveData(); }
function toggleFullMonth(id, val) { state.dates.forEach(d => { const iso = d.toISOString(); state.presences[`${id}_${iso}_J`] = val; state.presences[`${id}_${iso}_N`] = val; }); saveData(); }
function addAgent() { const n = prompt("Nom ?"); if(n) { state.agents.push({id:'id_'+Date.now(), name:n, isPro:true, cap:{CDD:false, AMU:false, BAT:false, BAL:false, CH:false}}); saveData(); } }
function updateCap(id, k, v) { state.agents.find(a=>a.id===id).cap[k]=v; saveData(); }
function updateAgentField(id, f, v) { state.agents.find(a=>a.id===id)[f]=v; saveData(); }
function deleteAgent(id) { if(confirm('Suppr?')){ state.agents=state.agents.filter(a=>a.id!==id); saveData(); } }
function changeMonth() { state.month = document.getElementById('month-input').value; state.presences={}; state.planning={}; updateDates(); saveData(); }
function switchTab(t) { document.getElementById('view-planning').classList.toggle('hidden', t!=='planning'); document.getElementById('view-agents').classList.toggle('hidden', t!=='agents'); document.getElementById('btn-tab-planning').classList.toggle('active', t==='planning'); document.getElementById('btn-tab-agents').classList.toggle('active', t==='agents'); if(t==='agents') renderAgents(); }
function exportToExcel() { /* Logique CSV conservée */ }

window.onload = loadData;
</script>
</body>
</html>
