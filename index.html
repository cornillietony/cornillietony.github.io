<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logiciel Planning Shift B - Version Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SCRIPTS FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; font-size: 0.82rem; }
        .tab-btn.active { background-color: #1a237e; color: white; border-bottom: 4px solid #facc15; }
        .tab-btn { background-color: #e5e7eb; color: #4b5563; transition: all 0.2s; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; text-align: center; }
        th, td { border: 1px solid #d1d5db; padding: 4px; }
        thead th { background-color: #1f2937; color: white; position: sticky; top: 0; z-index: 10; }
        .sticky-col { position: sticky; left: 0; background-color: white; z-index: 20; text-align: left; border-right: 2px solid #000 !important; min-width: 150px; }
        .role-select { width: 100%; border: none; background: transparent; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .role-select:focus { outline: 2px solid #1a237e; background: white; }
        
        /* Couleurs des rôles */
        .cell-AMU { background-color: #fef08a; }
        .cell-BAT { background-color: #93c5fd; }
        .cell-BAL { background-color: #86efac; }
        .cell-CH { background-color: #fdba74; }
        .cell-CDD { background-color: #fca5a5; }
        .cell-POLY { background-color: #d8b4fe; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-[98%] mx-auto mb-6 bg-white rounded-xl shadow-lg p-4 flex justify-between items-center border-b-4 border-[#1a237e]">
        <div>
            <h1 class="text-2xl font-bold text-[#1a237e]">Planning Shift B 🚒</h1>
            <p class="text-gray-500 font-medium italic">Base de données synchronisée en temps réel</p>
        </div>
        <div class="flex gap-2">
            <button onclick="switchTab('planning')" id="btn-tab-planning" class="tab-btn active px-6 py-2 rounded-t-lg font-bold">📅 PLANNING</button>
            <button onclick="switchTab('agents')" id="btn-tab-agents" class="tab-btn px-6 py-2 rounded-t-lg font-bold">👥 AGENTS & COMPTEURS</button>
        </div>
    </div>

    <div class="max-w-[98%] mx-auto">
        <!-- VUE PLANNING -->
        <div id="view-planning" class="space-y-6">
            <div class="bg-white rounded-xl shadow-md p-4 border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2"><span>1️⃣</span> Présences du mois</h2>
                    <input type="month" id="month-input" class="border-2 border-[#1a237e] rounded-lg p-2 font-bold" onchange="changeMonth()">
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-300" style="max-height: 50vh;">
                    <table id="table-pointage">
                        <thead id="thead-pointage"></thead>
                        <tbody id="tbody-pointage"></tbody>
                    </table>
                </div>
                <div class="mt-4 flex justify-end">
                    <button onclick="generatePlanning()" class="bg-[#1a237e] hover:bg-blue-800 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-all transform hover:scale-105">⚙️ GÉNÉRER LE PLANNING</button>
                </div>
            </div>

            <div id="result-container" class="hidden bg-white rounded-xl shadow-md p-4 border-2 border-green-500">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2"><span>2️⃣</span> Ajustement & Export</h2>
                    <div class="flex gap-3">
                        <button onclick="exportToExcel()" class="bg-gray-700 hover:bg-black text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2">📥 EXPORT EXCEL</button>
                        <button onclick="saveData(true)" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-bold shadow">💾 SAUVEGARDER</button>
                    </div>
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-400">
                    <table id="table-resultat">
                        <thead id="thead-resultat"></thead>
                        <tbody id="tbody-resultat"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VUE AGENTS -->
        <div id="view-agents" class="hidden bg-white rounded-xl shadow-md p-6 border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">Gestion des effectifs et Compteurs</h2>
                <button onclick="addAgent()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg shadow font-bold">➕ Ajouter un agent</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr>
                            <th class="p-3 sticky-col">Nom</th>
                            <th class="p-3">Statut</th>
                            <th class="p-3 bg-red-900 text-white">CDD</th>
                            <th class="p-3 bg-yellow-600 text-white">AMU</th>
                            <th class="p-3 bg-blue-700 text-white">BAT</th>
                            <th class="p-3 bg-green-700 text-white">BAL</th>
                            <th class="p-3 bg-orange-600 text-white">CH</th>
                            <th class="p-3 bg-purple-700 text-white">POLY</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-agents"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
// --- CONFIG FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyC1LrPXQ-j8rjf5LCzrJY4fZbxAS5i8kRc",
    authDomain: "planning-shift-b.firebaseapp.com",
    projectId: "planning-shift-b",
    storageBucket: "planning-shift-b.firebasestorage.app",
    messagingSenderId: "501907753582",
    appId: "1:501907753582:web:802533825145d5d65fb47f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("planning_data").doc("shift_b_shared");

const rolesListe = ["-", "CDD", "CH-PL", "AMU1-CH", "AMU1-EQ", "AMU2-CH", "AMU2-EQ", "BAT1", "BAT2", "BAL1", "BAL2", "POLY"];

let state = { agents: [], presences: {}, month: "2026-05", dates: [], planning: {} };

// --- LOGIQUE CLOUD ---
async function saveData(withAlert = false) {
    calculateCounters(); // Recalcule avant de sauver
    try {
        await docRef.set({
            agents: state.agents,
            presences: state.presences,
            month: state.month,
            planning: state.planning
        });
        if(withAlert) alert("✅ Modifications enregistrées dans le Cloud !");
    } catch (e) { console.error(e); }
}

function loadData() {
    docRef.onSnapshot((doc) => {
        if (doc.exists) {
            const data = doc.data();
            state.agents = data.agents || [];
            state.presences = data.presences || {};
            state.month = data.month || "2026-05";
            state.planning = data.planning || {};
            
            document.getElementById('month-input').value = state.month;
            updateDates();
            if(Object.keys(state.planning).length > 0) {
                document.getElementById('result-container').classList.remove('hidden');
                renderResult();
            }
            if (!document.getElementById('view-agents').classList.contains('hidden')) renderAgents();
        }
    });
}

// --- CALCULS COMPTEURS ---
function calculateCounters() {
    state.agents.forEach(a => {
        a.counters = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 };
    });

    Object.values(state.planning).forEach(day => {
        ['J', 'N'].forEach(shift => {
            if(day[shift]) {
                Object.entries(day[shift]).forEach(([agentId, role]) => {
                    const agent = state.agents.find(ag => ag.id === agentId);
                    if(agent && role !== "-") {
                        if(role === "CDD") agent.counters.CDD++;
                        else if(role.includes("AMU")) agent.counters.AMU++;
                        else if(role.includes("BAT")) agent.counters.BAT++;
                        else if(role.includes("BAL")) agent.counters.BAL++;
                        else if(role.includes("CH")) agent.counters.CH++;
                        else if(role === "POLY") agent.counters.POLY++;
                    }
                });
            }
        });
    });
}

// --- GESTION AGENTS ---
function addAgent() {
    const name = prompt("Nom de l'agent ?");
    if (!name) return;
    state.agents.push({
        id: 'id_' + Date.now(),
        name: name,
        isPro: true,
        cap: { CDD:false, AMU:false, BAT:false, BAL:false, CH:false },
        counters: { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 }
    });
    saveData();
}

function updateAgentField(id, field, value) {
    const agent = state.agents.find(a => a.id === id);
    if (!agent) return;
    if (field === 'isPro') agent.isPro = (value === 'true');
    else if (field === 'name') agent.name = value;
    else agent.cap[field] = value;
    saveData();
}

function renderAgents() {
    let tbody = "";
    state.agents.sort((a, b) => a.name.localeCompare(b.name)).forEach(a => {
        const c = a.counters || { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 };
        tbody += `
        <tr class="hover:bg-gray-50 font-medium">
            <td class="p-2 border sticky-col bg-white">
                <input type="text" class="w-full bg-transparent outline-none focus:bg-yellow-50" value="${a.name}" onchange="updateAgentField('${a.id}', 'name', this.value)">
            </td>
            <td class="border">
                <select onchange="updateAgentField('${a.id}', 'isPro', this.value)" class="p-1 rounded bg-gray-100">
                    <option value="true" ${a.isPro ? 'selected':''}>PRO</option>
                    <option value="false" ${!a.isPro ? 'selected':''}>VOL.</option>
                </select>
            </td>
            <td class="border bg-red-50 text-red-800 font-bold">${c.CDD}</td>
            <td class="border bg-yellow-50 text-yellow-800 font-bold">${c.AMU}</td>
            <td class="border bg-blue-50 text-blue-800 font-bold">${c.BAT}</td>
            <td class="border bg-green-50 text-green-800 font-bold">${c.BAL}</td>
            <td class="border bg-orange-50 text-orange-800 font-bold">${c.CH}</td>
            <td class="border bg-purple-50 text-purple-800 font-bold">${c.POLY}</td>
            <td class="border">
                <button onclick="if(confirm('Supprimer?')){state.agents=state.agents.filter(ag=>ag.id!=='${a.id}');saveData();}" class="text-red-500">❌</button>
            </td>
        </tr>`;
    });
    document.getElementById('tbody-agents').innerHTML = tbody;
}

// --- LOGIQUE PLANNING ---
function updateDates() { 
    const [y, m] = state.month.split('-'); 
    let ref = Date.UTC(2026, 3, 26);
    let dts = [];
    let d = new Date(Date.UTC(y, m-1, 1));
    while (d.getUTCMonth() === m-1) {
        if (Math.round((d.getTime() - ref) / 86400000) % 4 === 0) dts.push(new Date(d));
        d.setUTCDate(d.getUTCDate() + 1);
    }
    state.dates = dts; 
    renderPointage(); 
}

function renderPointage() {
    let thead1 = `<tr><th class="sticky-col">AGENT</th>`, thead2 = `<tr><th class="sticky-col"></th>`;
    state.dates.forEach(d => {
        thead1 += `<th colspan="2" class="border-l border-gray-500">${d.getUTCDate()}/${d.getUTCMonth()+1}</th>`;
        thead2 += `<th class="text-[10px] bg-blue-900">J</th><th class="text-[10px] bg-indigo-900">N</th>`;
    });
    document.getElementById('thead-pointage').innerHTML = thead1 + "</tr>" + thead2 + "</tr>";
    
    let tbody = "";
    state.agents.sort((a, b) => a.name.localeCompare(b.name)).forEach(agent => {
        tbody += `<tr><td class="sticky-col font-bold border-r border-black bg-white">${agent.name}</td>`;
        state.dates.forEach(d => {
            const iso = d.toISOString();
            tbody += `
            <td class="cursor-pointer hover:bg-blue-100" onclick="togglePresence('${agent.id}', '${iso}', 'J')">
                <input type="checkbox" ${state.presences[`${agent.id}_${iso}_J`] ? "checked":""} class="pointer-events-none">
            </td>
            <td class="cursor-pointer hover:bg-indigo-100" onclick="togglePresence('${agent.id}', '${iso}', 'N')">
                <input type="checkbox" ${state.presences[`${agent.id}_${iso}_N`] ? "checked":""} class="pointer-events-none">
            </td>`;
        });
        tbody += `</tr>`;
    });
    document.getElementById('tbody-pointage').innerHTML = tbody;
}

function togglePresence(id, iso, s) { 
    const k = `${id}_${iso}_${s}`; 
    state.presences[k] = !state.presences[k]; 
    saveData(); 
}

function changeMonth() { 
    state.month = document.getElementById('month-input').value; 
    state.presences = {}; state.planning = {};
    updateDates(); saveData(); 
}

// --- GÉNÉRATION AUTOMATIQUE ---
function generatePlanning() {
    let newPl = {};
    state.dates.forEach(d => {
        const dKey = d.toISOString();
        newPl[dKey] = { J: {}, N: {} };
        ['J', 'N'].forEach(shift => {
            let available = state.agents.filter(a => state.presences[`${a.id}_${dKey}_${shift}`]);
            let roles = ["CH-PL", "AMU1-CH", "AMU1-EQ", "BAT1", "BAL1"];
            available.forEach((agent, i) => {
                newPl[dKey][shift][agent.id] = roles[i] || "POLY";
            });
        });
    });
    state.planning = newPl;
    saveData();
}

// --- RENDU RÉSULTAT AVEC MODIFICATION MANUELLE ---
function updateManualRole(dKey, shift, agentId, newRole) {
    if(!state.planning[dKey]) state.planning[dKey] = { J:{}, N:{} };
    state.planning[dKey][shift][agentId] = newRole;
    // On ne sauve pas tout de suite pour laisser l'utilisateur faire plusieurs modifs
}

function renderResult() {
    let thead = `<tr><th class="sticky-col">Agent</th>`;
    state.dates.forEach(d => thead += `<th colspan="2" class="border-l border-gray-600">${d.getUTCDate()}/${d.getUTCMonth()+1}</th>`);
    document.getElementById('thead-resultat').innerHTML = thead + "</tr>";
    
    let tbody = "";
    state.agents.sort((a, b) => a.name.localeCompare(b.name)).forEach(a => {
        tbody += `<tr><td class="sticky-col font-bold bg-gray-50">${a.name}</td>`;
        state.dates.forEach(d => {
            const dKey = d.toISOString();
            ['J', 'N'].forEach(s => {
                const role = (state.planning[dKey] && state.planning[dKey][s]) ? state.planning[dKey][s][a.id] || "-" : "-";
                let colorClass = "";
                if(role.includes("AMU")) colorClass = "cell-AMU";
                else if(role.includes("BAT")) colorClass = "cell-BAT";
                else if(role.includes("BAL")) colorClass = "cell-BAL";
                else if(role.includes("CH")) colorClass = "cell-CH";
                else if(role === "CDD") colorClass = "cell-CDD";
                else if(role === "POLY") colorClass = "cell-POLY";

                tbody += `<td class="${colorClass}">
                    <select class="role-select" onchange="updateManualRole('${dKey}', '${s}', '${a.id}', this.value)">
                        ${rolesListe.map(r => `<option value="${r}" ${role === r ? 'selected':''}>${r}</option>`).join('')}
                    </select>
                </td>`;
            });
        });
        tbody += `</tr>`;
    });
    document.getElementById('tbody-resultat').innerHTML = tbody;
}

// --- EXPORT CSV ---
function exportToExcel() {
    let csv = "Agent;";
    state.dates.forEach(d => csv += `${d.getUTCDate()}/${d.getUTCMonth()+1} J;${d.getUTCDate()}/${d.getUTCMonth()+1} N;`);
    csv += "\n";

    state.agents.forEach(a => {
        csv += `${a.name};`;
        state.dates.forEach(d => {
            const dKey = d.toISOString();
            csv += `${(state.planning[dKey]?.J?.[a.id]) || "-"};`;
            csv += `${(state.planning[dKey]?.N?.[a.id]) || "-"};`;
        });
        csv += "\n";
    });

    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `planning_${state.month}.csv`;
    link.click();
}

function switchTab(t) {
    document.getElementById('view-planning').classList.toggle('hidden', t !== 'planning');
    document.getElementById('view-agents').classList.toggle('hidden', t !== 'agents');
    document.getElementById('btn-tab-planning').classList.toggle('active', t === 'planning');
    document.getElementById('btn-tab-agents').classList.toggle('active', t === 'agents');
    if(t === 'agents') renderAgents();
}

window.onload = loadData;
</script>
</body>
</html>
