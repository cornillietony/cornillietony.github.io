<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logiciel Planning Shift B - Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SCRIPTS FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; font-size: 0.85rem; }
        .tab-btn.active { background-color: #1a237e; color: white; }
        .tab-btn { background-color: #f3f4f6; color: #4b5563; transition: all 0.2s; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; white-space: nowrap; text-align: center; border: 1px solid #1f2937; }
        th, td { border: 1px solid #374151; padding: 6px; }
        thead th { background-color: #1f2937; color: white; font-weight: 600; }
        .sticky-col { position: sticky; left: 0; background-color: white; z-index: 10; text-align: left; border-right: 2px solid #000 !important; }
        th.sticky-col { z-index: 20; background-color: #1f2937; color: white; }
        .chk-label { display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: bold; }
        .input-name { border: none; background: transparent; font-weight: bold; width: 100%; }
        .input-name:focus { background: #fff9c4; outline: none; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-7xl mx-auto mb-6 bg-white rounded-xl shadow-sm p-4 flex justify-between items-center border-t-4 border-[#1a237e]">
        <div>
            <h1 class="text-2xl font-bold text-[#1a237e]">Planning Shift B ☁️</h1>
            <p class="text-gray-500 font-medium">Gestion des compétences et statuts</p>
        </div>
        <div class="flex gap-2">
            <button onclick="switchTab('planning')" id="btn-tab-planning" class="tab-btn active px-4 py-2 rounded-lg font-medium shadow-sm">📅 Planning</button>
            <button onclick="switchTab('agents')" id="btn-tab-agents" class="tab-btn px-4 py-2 rounded-lg font-medium shadow-sm">👥 Agents & Compétences</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- VUE PLANNING -->
        <div id="view-planning">
            <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">✅ 1. Saisie des présences</h2>
                    <input type="month" id="month-input" class="border border-gray-400 rounded-md p-2" onchange="changeMonth()">
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-800" style="max-height: 60vh;">
                    <table id="table-pointage">
                        <thead id="thead-pointage"></thead>
                        <tbody id="tbody-pointage"></tbody>
                    </table>
                </div>
                <div class="mt-5 flex justify-end">
                    <button onclick="generatePlanning()" class="bg-[#1a237e] hover:bg-blue-800 text-white px-6 py-2 rounded-lg font-bold shadow transition">⚙️ 2. Générer le planning</button>
                </div>
            </div>

            <div id="result-container" class="hidden mt-6 bg-white rounded-xl shadow-sm p-5 border border-green-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">📊 3. Planning Généré</h2>
                    <button onclick="saveData()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold shadow">💾 Sauvegarder les modifications</button>
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-800">
                    <table id="table-resultat">
                        <thead id="thead-resultat"></thead>
                        <tbody id="tbody-resultat"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VUE AGENTS -->
        <div id="view-agents" class="hidden bg-white rounded-xl shadow-sm p-5 border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">Base de données Agents</h2>
                <div class="flex gap-2">
                    <button onclick="addAgent()" class="bg-green-600 text-white px-4 py-2 rounded-lg shadow font-bold">➕ Ajouter un agent</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table id="table-agents">
                    <thead>
                        <tr>
                            <th class="p-3 sticky-col">Nom de l'agent</th>
                            <th class="p-3">Statut</th>
                            <th class="p-3">CDD</th>
                            <th class="p-3">AMU</th>
                            <th class="p-3">BAT</th>
                            <th class="p-3">BAL</th>
                            <th class="p-3">CH</th>
                            <th class="p-3" style="width: 80px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-agents"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
// --- CONFIG FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyC1LrPXQ-j8rjf5LCzrJY4fZbxAS5i8kRc",
    authDomain: "planning-shift-b.firebaseapp.com",
    projectId: "planning-shift-b",
    storageBucket: "planning-shift-b.firebasestorage.app",
    messagingSenderId: "501907753582",
    appId: "1:501907753582:web:802533825145d5d65fb47f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("planning_data").doc("shift_b_shared");

let state = { agents: [], counters: {}, roleHistory: {}, presences: {}, month: "2026-05", dates: [], planning: null };

// --- ACTIONS CLOUD ---
async function saveData() {
    try {
        await docRef.set({
            agents: state.agents,
            counters: state.counters,
            roleHistory: state.roleHistory,
            presences: state.presences,
            month: state.month,
            planning: state.planning
        });
    } catch (e) { console.error("Erreur Cloud Save:", e); }
}

function loadData() {
    docRef.onSnapshot((doc) => {
        if (doc.exists) {
            const data = doc.data();
            state.agents = data.agents || [];
            state.counters = data.counters || {};
            state.roleHistory = data.roleHistory || {};
            state.presences = data.presences || {};
            state.month = data.month || "2026-05";
            state.planning = data.planning || null;
            
            document.getElementById('month-input').value = state.month;
            updateDates();
            if(state.planning) {
                document.getElementById('result-container').classList.remove('hidden');
                renderResult();
            }
            if (!document.getElementById('view-agents').classList.contains('hidden')) renderAgents();
        }
    });
}

// --- GESTION AGENTS ---
function addAgent() {
    const name = prompt("Nom et Prénom de l'agent ?");
    if (!name) return;
    const id = 'id_' + Date.now();
    state.agents.push({
        id: id,
        name: name,
        isPro: true, // Par défaut PRO
        cap: { CDD: false, AMU: false, BAT: false, BAL: false, CH: false }
    });
    state.counters[id] = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 };
    saveData();
}

function deleteAgent(id) {
    if (confirm("Supprimer cet agent définitivement ?")) {
        state.agents = state.agents.filter(a => a.id !== id);
        saveData();
    }
}

function updateAgentField(id, field, value) {
    const agent = state.agents.find(a => a.id === id);
    if (agent) {
        if (field === 'isPro') agent.isPro = (value === 'true');
        else if (field === 'name') agent.name = value;
        else agent.cap[field] = value;
        saveData();
    }
}

function renderAgents() {
    let tbody = "";
    state.agents.sort((a, b) => a.name.localeCompare(b.name)).forEach(a => {
        tbody += `
        <tr class="hover:bg-gray-50">
            <td class="p-2 border sticky-col">
                <input type="text" class="input-name" value="${a.name}" onchange="updateAgentField('${a.id}', 'name', this.value)">
            </td>
            <td class="border">
                <select onchange="updateAgentField('${a.id}', 'isPro', this.value)" class="p-1 rounded border">
                    <option value="true" ${a.isPro ? 'selected':''}>PRO</option>
                    <option value="false" ${!a.isPro ? 'selected':''}>VOLONT.</option>
                </select>
            </td>
            <td class="border"><input type="checkbox" ${a.cap.CDD?'checked':''} onchange="updateAgentField('${a.id}','CDD',this.checked)"></td>
            <td class="border"><input type="checkbox" ${a.cap.AMU?'checked':''} onchange="updateAgentField('${a.id}','AMU',this.checked)"></td>
            <td class="border"><input type="checkbox" ${a.cap.BAT?'checked':''} onchange="updateAgentField('${a.id}','BAT',this.checked)"></td>
            <td class="border"><input type="checkbox" ${a.cap.BAL?'checked':''} onchange="updateAgentField('${a.id}','BAL',this.checked)"></td>
            <td class="border"><input type="checkbox" ${a.cap.CH?'checked':''} onchange="updateAgentField('${a.id}','CH',this.checked)"></td>
            <td class="border">
                <button onclick="deleteAgent('${a.id}')" class="text-red-500 hover:text-red-700 font-bold text-xs">Suppr.</button>
            </td>
        </tr>`;
    });
    document.getElementById('tbody-agents').innerHTML = tbody;
}

// --- LOGIQUE PLANNING ---
function switchTab(t) {
    document.getElementById('view-planning').classList.toggle('hidden', t !== 'planning');
    document.getElementById('view-agents').classList.toggle('hidden', t !== 'agents');
    document.getElementById('btn-tab-planning').classList.toggle('active', t === 'planning');
    document.getElementById('btn-tab-agents').classList.toggle('active', t === 'agents');
    if(t === 'agents') renderAgents();
}

function getGardeDates(y, m) {
    let ref = Date.UTC(2026, 3, 26);
    let dts = [];
    let d = new Date(Date.UTC(y, m, 1));
    while (d.getUTCMonth() === m) {
        if (Math.round((d.getTime() - ref) / 86400000) % 4 === 0) dts.push(new Date(d));
        d.setUTCDate(d.getUTCDate() + 1);
    }
    return dts;
}

function updateDates() { 
    const p = state.month.split('-'); 
    state.dates = getGardeDates(parseInt(p[0]), parseInt(p[1]) - 1); 
    renderPointage(); 
}

function renderPointage() {
    let thead1 = `<tr><th class="sticky-col">Agent</th>`, thead2 = `<tr><th class="sticky-col"></th>`;
    state.dates.forEach(d => {
        const ds = d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
        thead1 += `<th colspan="2" class="border-l border-gray-600">${ds}</th>`;
        thead2 += `<th class="text-[10px] bg-gray-700 text-white">J</th><th class="text-[10px] bg-gray-600 text-white">N</th>`;
    });
    document.getElementById('thead-pointage').innerHTML = thead1 + "</tr>" + thead2 + "</tr>";
    
    let tbody = "";
    state.agents.sort((a, b) => a.name.localeCompare(b.name)).forEach(agent => {
        tbody += `<tr><td class="sticky-col font-bold border-r border-black bg-white">${agent.name}</td>`;
        state.dates.forEach(d => {
            const iso = d.toISOString();
            tbody += `<td class="cursor-pointer" onclick="toggleCell('${agent.id}', '${iso}', 'J')"><input type="checkbox" ${state.presences[`${agent.id}_${iso}_J`] ? "checked":""} class="pointer-events-none"></td>`;
            tbody += `<td class="cursor-pointer bg-gray-50" onclick="toggleCell('${agent.id}', '${iso}', 'N')"><input type="checkbox" ${state.presences[`${agent.id}_${iso}_N`] ? "checked":""} class="pointer-events-none"></td>`;
        });
        tbody += `</tr>`;
    });
    document.getElementById('tbody-pointage').innerHTML = tbody;
}

function toggleCell(id, iso, s) { 
    const k = `${id}_${iso}_${s}`; 
    state.presences[k] = !state.presences[k]; 
    saveData(); 
}

function changeMonth() { 
    state.month = document.getElementById('month-input').value; 
    state.presences = {}; 
    state.planning = null;
    updateDates(); 
    saveData(); 
}

function generatePlanning() {
    let newPlanning = {};
    const rolesPrio = ["CH-PL", "AMU1-CH", "AMU1-EQ", "AMU2-CH", "AMU2-EQ", "BAT1", "BAT2", "BAL1", "BAL2"];
    
    state.dates.forEach(d => {
        const dateKey = d.toISOString();
        newPlanning[dateKey] = { J: {}, N: {} };
        ['J', 'N'].forEach(shift => {
            let available = state.agents.filter(a => state.presences[`${a.id}_${dateKey}_${shift}`]);
            let assigned = new Set();
            
            rolesPrio.forEach(role => {
                // Recherche d'un agent avec la bonne compétence qui n'est pas encore assigné
                let found = available.find(a => {
                    if (assigned.has(a.id)) return false;
                    if (role === "CH-PL") return a.cap.CH;
                    if (role.includes("AMU")) return a.cap.AMU;
                    if (role.includes("BAT")) return a.cap.BAT;
                    if (role.includes("BAL")) return a.cap.BAL;
                    return true;
                });

                if (found) {
                    newPlanning[dateKey][shift][found.id] = role;
                    assigned.add(found.id);
                }
            });
            
            // Les autres deviennent Polyvalents
            available.forEach(a => {
                if (!assigned.has(a.id)) {
                    newPlanning[dateKey][shift][a.id] = "POLY";
                }
            });
        });
    });
    state.planning = newPlanning;
    saveData();
}

function renderResult() {
    let thead = `<tr><th class="sticky-col">Agent</th>`;
    state.dates.forEach(d => thead += `<th colspan="2" class="border-l border-gray-600">${d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'})}</th>`);
    document.getElementById('thead-resultat').innerHTML = thead + "</tr>";
    
    let tbody = "";
    state.agents.sort((a, b) => a.name.localeCompare(b.name)).forEach(a => {
        tbody += `<tr><td class="sticky-col font-bold border-r border-black bg-white">${a.name}</td>`;
        state.dates.forEach(d => {
            ['J', 'N'].forEach(s => {
                const r = (state.planning && state.planning[d.toISOString()] && state.planning[d.toISOString()][s]) ? state.planning[d.toISOString()][s][a.id] : "-";
                tbody += `<td class="text-[10px] border border-gray-300">${r}</td>`;
            });
        });
        tbody += `</tr>`;
    });
    document.getElementById('tbody-resultat').innerHTML = tbody;
}

window.onload = loadData;
</script>
</body>
</html>
