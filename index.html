<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logiciel Planning Shift B - Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SCRIPTS FIREBASE COMPAT (Version stable pour fichier unique) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; font-size: 0.85rem; }
        .tab-btn.active { background-color: #1a237e; color: white; }
        .tab-btn { background-color: #f3f4f6; color: #4b5563; transition: all 0.2s; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; white-space: nowrap; text-align: center; border: 1px solid #1f2937; }
        th, td { border: 1px solid #374151; padding: 4px; }
        thead th { background-color: #1f2937; color: white; }
        .sticky-col { position: sticky; left: 0; background-color: white; z-index: 10; text-align: left; border-right: 2px solid #000 !important; }
        th.sticky-col { z-index: 20; background-color: #1f2937; color: white; }
        .role-select { width: 100%; border: none; font-weight: bold; padding: 2px; border-radius: 4px; cursor: pointer; text-align: center; font-size: 0.75rem; }
        .val-AMU { background-color: #ffeb3b; color: black; }
        .val-AMU2 { background-color: #fff9c4; color: black; }
        .val-BAT { background-color: #1e88e5; color: white; }
        .val-BAL { background-color: #43a047; color: white; }
        .val-CH { background-color: #fb8c00; color: white; }
        .val-CDD { background-color: #d32f2f; color: white; }
        .val-POLY { background-color: #9c27b0; color: white; }
        .val-ABS { background-color: #f3f4f6; color: #9ca3af; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-7xl mx-auto mb-6 bg-white rounded-xl shadow-sm p-4 flex justify-between items-center border-t-4 border-[#1a237e]">
        <div>
            <h1 class="text-2xl font-bold text-[#1a237e]">Planning Shift B ☁️</h1>
            <p class="text-gray-500 font-medium">Synchronisation Cloud Temps Réel</p>
        </div>
        <div class="flex gap-2">
            <button onclick="switchTab('planning')" id="btn-tab-planning" class="tab-btn active px-4 py-2 rounded-lg font-medium">📅 Planning</button>
            <button onclick="switchTab('agents')" id="btn-tab-agents" class="tab-btn px-4 py-2 rounded-lg font-medium">👥 Agents</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- VUE PLANNING -->
        <div id="view-planning">
            <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">✅ 1. Saisie des présences</h2>
                    <input type="month" id="month-input" class="border border-gray-400 rounded-md p-2" onchange="changeMonth()">
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-800" style="max-height: 60vh;">
                    <table id="table-pointage">
                        <thead id="thead-pointage"></thead>
                        <tbody id="tbody-pointage"></tbody>
                    </table>
                </div>
                <div class="mt-5 flex justify-end">
                    <button onclick="generatePlanning()" class="bg-[#1a237e] hover:bg-blue-800 text-white px-6 py-2 rounded-lg font-bold shadow transition">⚙️ 2. Générer</button>
                </div>
            </div>

            <div id="result-container" class="hidden mt-6 bg-white rounded-xl shadow-sm p-5 border border-green-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">📊 3. Ajustement & Cloud</h2>
                    <div class="flex gap-2">
                        <button id="btn-validate" onclick="confirmPlanning()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold shadow">💾 Valider & Sauvegarder</button>
                        <button onclick="exportCSV()" class="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold shadow">📥 Export CSV</button>
                    </div>
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-800">
                    <table id="table-resultat">
                        <thead id="thead-resultat"></thead>
                        <tbody id="tbody-resultat"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VUE AGENTS -->
        <div id="view-agents" class="hidden bg-white rounded-xl shadow-sm p-5 border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">Base de données Agents</h2>
                <div class="flex gap-2">
                    <button onclick="addVolontaire()" class="bg-green-600 text-white px-4 py-2 rounded-lg shadow">➕ Ajouter</button>
                    <button onclick="resetCounters()" class="bg-red-600 text-white px-4 py-2 rounded-lg shadow">🔄 RAZ Compteurs</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table id="table-agents">
                    <thead>
                        <tr>
                            <th class="p-3 sticky-col">Nom</th>
                            <th class="p-3">Type</th>
                            <th class="p-3">Aptitudes</th>
                            <th class="p-3">AMU</th>
                            <th class="p-3">BAT</th>
                            <th class="p-3">CH</th>
                            <th class="p-3">BAL</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-agents"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
// --- CONFIGURATION FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyC1LrPXQ-j8rjf5LCzrJY4fZbxAS5i8kRc",
    authDomain: "planning-shift-b.firebaseapp.com",
    projectId: "planning-shift-b",
    storageBucket: "planning-shift-b.firebasestorage.app",
    messagingSenderId: "501907753582",
    appId: "1:501907753582:web:802533825145d5d65fb47f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("planning_data").doc("shift_b_shared");

// --- LOGIQUE METIER ---
const MEMORY_DEPTH = 4;
const allRoles = ["-", "CDD", "CH-PL", "AMU1-CH", "AMU1-EQ", "AMU2-CH", "AMU2-EQ", "BAT1", "BAT2", "BAL1", "BAL2", "Polyvalent 1", "Polyvalent 2", "Polyvalent 3", "Polyvalent 4", "Polyvalent 5"];
const rolesPrio = ["CDD", "CH-PL", "AMU1-CH", "AMU1-EQ", "AMU2-CH", "AMU2-EQ", "BAT1", "BAT2", "BAL1", "BAL2"];
const rolesChauffeur = ["CH-PL", "AMU1-CH", "AMU2-CH"];
const rolesAMU1 = ["AMU1-CH", "AMU1-EQ"];

let state = { agents: [], counters: {}, roleHistory: {}, presences: {}, month: "2026-05", dates: [], planning: null, proposedCounters: null };

async function saveData() {
    try {
        await docRef.set({
            agents: state.agents,
            counters: state.counters,
            roleHistory: state.roleHistory,
            presences: state.presences,
            month: state.month,
            planning: state.planning || null
        });
    } catch (e) { console.error("Erreur Save:", e); }
}

function loadData() {
    docRef.onSnapshot((doc) => {
        if (doc.exists) {
            const data = doc.data();
            state = { ...state, ...data };
            document.getElementById('month-input').value = state.month;
            updateDates();
            if(state.planning) {
                document.getElementById('result-container').classList.remove('hidden');
                renderResult();
            }
        } else {
            console.log("Initialisation des données...");
            state.agents = [
                { id: 'p1', name: "Geoffrey V", isPro: true, cap: { CDD: true, AMU: true, BAT: true, CH: true, BAL: true } },
                { id: 'p2', name: "Dany", isPro: true, cap: { CDD: true, AMU: true, BAT: true, CH: true, BAL: true } }
            ];
            state.agents.forEach(a => { state.counters[a.id] = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 }; state.roleHistory[a.id] = []; });
            saveData();
        }
    });
}

function getGardeDates(y, m) {
    let ref = Date.UTC(2026, 3, 26);
    let dts = [];
    let d = new Date(Date.UTC(y, m, 1));
    while (d.getUTCMonth() === m) {
        if (Math.round((d.getTime() - ref) / 86400000) % 4 === 0) dts.push(new Date(d));
        d.setUTCDate(d.getUTCDate() + 1);
    }
    return dts;
}

function getFamily(role) {
    if(!role || role === "-") return null;
    if (role.includes("AMU")) return "AMU";
    if (role.includes("BAT")) return "BAT";
    if (role.includes("BAL")) return "BAL";
    if (role.includes("CH")) return "CH";
    if (role === "CDD") return "CDD";
    return "POLY";
}

function getRoleColorClass(r) {
    if (r.includes("AMU2")) return "val-AMU2";
    const f = getFamily(r);
    return f ? `val-${f}` : "val-ABS";
}

function updateDates() { 
    const p = state.month.split('-'); 
    state.dates = getGardeDates(parseInt(p[0]), parseInt(p[1]) - 1); 
    renderPointage(); 
}

function renderPointage() {
    let thead1 = `<tr><th class="sticky-col">Agent</th>`, thead2 = `<tr><th class="sticky-col"></th>`;
    state.dates.forEach(d => {
        const ds = d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
        thead1 += `<th colspan="2" class="border-l border-gray-600">${ds}</th>`;
        thead2 += `<th class="text-[10px]">J</th><th class="text-[10px]">N</th>`;
    });
    document.getElementById('thead-pointage').innerHTML = thead1 + "</tr>" + thead2 + "</tr>";
    
    let tbody = "";
    state.agents.forEach(agent => {
        tbody += `<tr><td class="sticky-col font-bold border-r border-black">${agent.name}</td>`;
        state.dates.forEach(d => {
            const iso = d.toISOString();
            tbody += `<td class="cursor-pointer" onclick="toggleCell('${agent.id}', '${iso}', 'J')"><input type="checkbox" ${state.presences[`${agent.id}_${iso}_J`] ? "checked":""} class="pointer-events-none"></td>`;
            tbody += `<td class="cursor-pointer bg-gray-50" onclick="toggleCell('${agent.id}', '${iso}', 'N')"><input type="checkbox" ${state.presences[`${agent.id}_${iso}_N`] ? "checked":""} class="pointer-events-none"></td>`;
        });
        tbody += `</tr>`;
    });
    document.getElementById('tbody-pointage').innerHTML = tbody;
}

function toggleCell(id, iso, s) { 
    const k = `${id}_${iso}_${s}`; 
    state.presences[k] = !state.presences[k]; 
    renderPointage(); 
    saveData(); 
}

function changeMonth() { 
    state.month = document.getElementById('month-input').value; 
    state.presences = {}; 
    updateDates(); 
    saveData(); 
}

function generatePlanning() {
    let newPlanning = {};
    let monthlyCounters = {};
    state.agents.forEach(a => monthlyCounters[a.id] = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0 });

    state.dates.forEach(d => {
        const dateKey = d.toISOString();
        newPlanning[dateKey] = { J: {}, N: {} };
        ['J', 'N'].forEach(shift => {
            let takenRoles = [];
            let shiftAgents = state.agents.filter(a => state.presences[`${a.id}_${dateKey}_${shift}`]);
            
            rolesPrio.forEach(role => {
                let eligible = shiftAgents.filter(a => !newPlanning[dateKey][shift][a.id]);
                if (eligible.length > 0) {
                    const selected = eligible[0]; // Logique simplifiée pour l'exemple
                    newPlanning[dateKey][shift][selected.id] = role;
                    takenRoles.push(role);
                }
            });
        });
    });
    state.planning = newPlanning;
    document.getElementById('result-container').classList.remove('hidden');
    renderResult();
}

function renderResult() {
    let thead = `<tr><th class="sticky-col">Agent</th>`;
    state.dates.forEach(d => thead += `<th colspan="2" class="border-l border-gray-600">${d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'})}</th>`);
    document.getElementById('thead-resultat').innerHTML = thead + "</tr>";
    
    let tbody = "";
    state.agents.forEach(a => {
        tbody += `<tr><td class="sticky-col font-bold border-r border-black">${a.name}</td>`;
        state.dates.forEach(d => {
            ['J', 'N'].forEach(s => {
                const r = (state.planning && state.planning[d.toISOString()] && state.planning[d.toISOString()][s]) ? state.planning[d.toISOString()][s][a.id] : "-";
                tbody += `<td class="${getRoleColorClass(r)}">${r}</td>`;
            });
        });
        tbody += `</tr>`;
    });
    document.getElementById('tbody-resultat').innerHTML = tbody;
}

function renderAgents() {
    let tbody = "";
    state.agents.forEach(a => {
        const c = state.counters[a.id] || { AMU:0, BAT:0, CH:0, BAL:0 };
        tbody += `<tr>
            <td class="p-2 border">${a.name}</td>
            <td class="border">${a.isPro ? 'PRO' : 'VOL'}</td>
            <td class="border text-[10px]">Aptitudes OK</td>
            <td class="border">${c.AMU}</td>
            <td class="border">${c.BAT}</td>
            <td class="border">${c.CH}</td>
            <td class="border">${c.BAL}</td>
            <td class="border"><button onclick="deleteAgent('${a.id}')" class="text-red-600">Suppr.</button></td>
        </tr>`;
    });
    document.getElementById('tbody-agents').innerHTML = tbody;
}

function switchTab(t) {
    document.getElementById('view-planning').classList.toggle('hidden', t !== 'planning');
    document.getElementById('view-agents').classList.toggle('hidden', t !== 'agents');
    document.getElementById('btn-tab-planning').classList.toggle('active', t === 'planning');
    document.getElementById('btn-tab-agents').classList.toggle('active', t === 'agents');
    if(t === 'agents') renderAgents();
}

window.onload = loadData;
</script>
</body>
</html>
