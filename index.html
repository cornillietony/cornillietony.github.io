<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logiciel Planning Shift B - Firebase Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; font-size: 0.85rem; }
        .tab-btn.active { background-color: #1a237e; color: white; }
        .tab-btn { background-color: #f3f4f6; color: #4b5563; transition: all 0.2s; }
        .tab-btn:hover:not(.active) { background-color: #e5e7eb; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; white-space: nowrap; text-align: center; border: 1px solid #1f2937; }
        th, td { border: 1px solid #374151; padding: 4px; }
        thead th { background-color: #1f2937; color: white; border-bottom: 2px solid #000; }
        .sticky-col { position: sticky; left: 0; background-color: white; z-index: 10; text-align: left; border-right: 2px solid #000 !important; }
        th.sticky-col { z-index: 20; background-color: #1f2937; color: white; }
        tbody tr:hover td { background-color: #f0f4ff !important; }
        tbody tr:hover td.sticky-col { background-color: #e5e7eb !important; }
        .role-select { width: 100%; border: none; font-weight: bold; padding: 2px; border-radius: 4px; cursor: pointer; text-align: center; font-size: 0.75rem; }
        .val-AMU { background-color: #ffeb3b; color: black; }
        .val-AMU2 { background-color: #fff9c4; color: black; }
        .val-BAT { background-color: #1e88e5; color: white; }
        .val-BAL { background-color: #43a047; color: white; }
        .val-CH { background-color: #fb8c00; color: white; }
        .val-CDD { background-color: #d32f2f; color: white; }
        .val-POLY { background-color: #9c27b0; color: white; }
        .val-ABS { background-color: #f3f4f6; color: #9ca3af; }
        .total-row { background-color: #374151 !important; color: white; font-weight: bold; }
        .total-row td { border-top: 2px solid #000; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-7xl mx-auto mb-6 bg-white rounded-xl shadow-sm p-4 flex justify-between items-center border-t-4 border-[#1a237e]">
        <div>
            <h1 class="text-2xl font-bold text-[#1a237e]">Planning Shift B ☁️</h1>
            <p class="text-gray-500 font-medium">Synchronisation Cloud Temps Réel</p>
        </div>
        <div class="flex gap-2">
            <button onclick="switchTab('planning')" id="btn-tab-planning" class="tab-btn active px-4 py-2 rounded-lg font-medium flex items-center gap-2">📅 Planning</button>
            <button onclick="switchTab('agents')" id="btn-tab-agents" class="tab-btn px-4 py-2 rounded-lg font-medium flex items-center gap-2">👥 Agents</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto space-y-6">
        <div id="view-planning">
            <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">✅ 1. Saisie des présences</h2>
                    <input type="month" id="month-input" class="border border-gray-400 rounded-md p-2 font-medium" onchange="changeMonth()">
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-800" style="max-height: 60vh;">
                    <table id="table-pointage">
                        <thead id="thead-pointage"></thead>
                        <tbody id="tbody-pointage"></tbody>
                    </table>
                </div>
                <div class="mt-5 flex justify-end">
                    <button onclick="generatePlanning()" class="bg-[#1a237e] hover:bg-blue-800 text-white px-6 py-2 rounded-lg font-bold shadow transition">⚙️ 2. Générer</button>
                </div>
            </div>

            <div id="result-container" class="hidden mt-6 bg-white rounded-xl shadow-sm p-5 border border-green-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">📊 3. Ajustement & Cloud</h2>
                    <div class="flex gap-2">
                        <button id="btn-validate" onclick="confirmPlanning()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold shadow transition">💾 Valider (Partager partout)</button>
                        <button onclick="exportCSV()" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg font-bold shadow transition">📥 Export CSV</button>
                    </div>
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-800">
                    <table id="table-resultat">
                        <thead id="thead-resultat"></thead>
                        <tbody id="tbody-resultat"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-agents" class="hidden bg-white rounded-xl shadow-sm p-5 border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">Base de données Agents</h2>
                <div class="flex gap-2">
                    <button onclick="addVolontaire()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow">➕ Ajouter</button>
                    <button onclick="resetCounters()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow">🔄 RAZ</button>
                </div>
            </div>
            <div class="overflow-x-auto rounded-lg border border-gray-800">
                <table id="table-agents">
                    <thead class="text-xs uppercase">
                        <tr>
                            <th class="p-3 text-left sticky-col">Nom</th>
                            <th class="p-3">Type</th>
                            <th class="p-3">Aptitudes</th>
                            <th class="p-3">AMU</th>
                            <th class="p-3">BAT</th>
                            <th class="p-3">CH</th>
                            <th class="p-3 text-green-400">BAL</th>
                            <th class="p-3">Historique</th>
                            <th class="p-3 text-red-400">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-agents"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
// --- CONFIGURATION FIREBASE ---
const firebaseConfig = {
    apiKey: "VOTRE_API_KEY",
    authDomain: "VOTRE_PROJET.firebaseapp.com",
    projectId: "VOTRE_PROJET_ID",
    storageBucket: "VOTRE_PROJET.appspot.com",
    messagingSenderId: "VOTRE_ID",
    appId: "VOTRE_APP_ID"
};

// Initialisation Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("planning_data").doc("shift_b_shared");
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyC1LrPXQ-j8rjf5LCzrJY4fZbxAS5i8kRc",
    authDomain: "planning-shift-b.firebaseapp.com",
    projectId: "planning-shift-b",
    storageBucket: "planning-shift-b.firebasestorage.app",
    messagingSenderId: "501907753582",
    appId: "1:501907753582:web:802533825145d5d65fb47f",
    measurementId: "G-HYP85TZC7E"
  };

// --- CONFIGURATION PLANNING ---
const MEMORY_DEPTH = 4;
const allRoles = ["-", "CDD", "CH-PL", "AMU1-CH", "AMU1-EQ", "AMU2-CH", "AMU2-EQ", "BAT1", "BAT2", "BAL1", "BAL2", "Polyvalent 1", "Polyvalent 2", "Polyvalent 3", "Polyvalent 4", "Polyvalent 5"];
const rolesPrio = ["CDD", "CH-PL", "AMU1-CH", "AMU1-EQ", "AMU2-CH", "AMU2-EQ", "BAT1", "BAT2", "BAL1", "BAL2"];
const rolesChauffeur = ["CH-PL", "AMU1-CH", "AMU2-CH"];
const rolesAMU1 = ["AMU1-CH", "AMU1-EQ"];

const defaultPros = [
    { id: 'p1', name: "Geoffrey V", isPro: true, cap: { CDD: true, AMU: true, BAT: true, CH: true, BAL: true } },
    { id: 'p2', name: "Dany", isPro: true, cap: { CDD: true, AMU: true, BAT: true, CH: true, BAL: true } },
    { id: 'p3', name: "Tony", isPro: true, cap: { CDD: false, AMU: true, BAT: true, CH: true, BAL: true } },
    { id: 'p4', name: "Jérome", isPro: true, cap: { CDD: false, AMU: true, BAT: true, CH: true, BAL: true } },
    { id: 'p5', name: "Fabien", isPro: true, cap: { CDD: false, AMU: true, BAT: true, CH: true, BAL: true } },
    { id: 'p6', name: "Geoffrey B", isPro: true, cap: { CDD: false, AMU: true, BAT: true, CH: true, BAL: true } },
    { id: 'p7', name: "Laurent", isPro: true, cap: { CDD: false, AMU: true, BAT: true, CH: true, BAL: true } },
    { id: 'p8', name: "Alain", isPro: true, cap: { CDD: false, AMU: false, BAT: true, CH: true, BAL: true } },
    { id: 'p9', name: "David", isPro: true, cap: { CDD: false, AMU: true, BAT: true, CH: true, BAL: true } },
    { id: 'p10', name: "Gaetan", isPro: true, cap: { CDD: false, AMU: true, BAT: true, CH: true, BAL: true } },
    { id: 'p11', name: "Phillipe", isPro: true, cap: { CDD: false, AMU: true, BAT: true, CH: true, BAL: true } }
];

let state = { agents: [], counters: {}, roleHistory: {}, presences: {}, month: "2026-05", dates: [], planning: null, proposedCounters: null };

// --- FONCTIONS CLOUD ---
async function saveData() {
    try {
        await docRef.set({
            agents: state.agents,
            counters: state.counters,
            roleHistory: state.roleHistory,
            presences: state.presences,
            month: state.month,
            planning: state.planning || null
        });
    } catch (e) { console.error("Save error", e); }
}

function loadData() {
    docRef.onSnapshot((doc) => {
        if (doc.exists) {
            const data = doc.data();
            state.agents = data.agents;
            state.counters = data.counters;
            state.roleHistory = data.roleHistory || {};
            state.presences = data.presences || {};
            state.month = data.month || "2026-05";
            if(data.planning) {
                state.planning = data.planning;
                document.getElementById('result-container').classList.remove('hidden');
            }
            document.getElementById('month-input').value = state.month;
            updateDates();
            if(state.planning) renderResult();
        } else {
            state.agents = JSON.parse(JSON.stringify(defaultPros));
            state.agents.forEach(a => { state.counters[a.id] = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 }; state.roleHistory[a.id] = []; });
            saveData();
        }
    });
}

// --- LOGIQUE METIER (CONSERVÉE) ---
function getGardeDates(y, m) {
    let ref = Date.UTC(2026, 3, 26);
    let dts = [];
    let d = new Date(Date.UTC(y, m, 1));
    while (d.getUTCMonth() === m) {
        if (Math.round((d.getTime() - ref) / 86400000) % 4 === 0) dts.push(new Date(d));
        d.setUTCDate(d.getUTCDate() + 1);
    }
    return dts;
}

function getFamily(role) {
    if(!role || role === "-") return null;
    if (role.includes("AMU")) return "AMU";
    if (role.includes("BAT")) return "BAT";
    if (role.includes("BAL")) return "BAL";
    if (role.includes("CH")) return "CH";
    if (role === "CDD") return "CDD";
    return "POLY";
}

function getRoleColorClass(r) {
    if (r.includes("AMU2")) return "val-AMU2";
    const f = getFamily(r);
    return f ? `val-${f}` : "val-ABS";
}

function generatePlanning() {
    let newPlanning = {};
    let currentHistory = JSON.parse(JSON.stringify(state.roleHistory));
    let monthlyCounters = {};
    state.agents.forEach(a => monthlyCounters[a.id] = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0 });

    state.dates.forEach(d => {
        const dateKey = d.toISOString();
        newPlanning[dateKey] = { J: {}, N: {} };
        ['J', 'N'].forEach(shift => {
            let takenRoles = [];
            let shiftAgents = state.agents.filter(a => state.presences[`${a.id}_${dateKey}_${shift}`]);
            if (shift === 'N') {
                shiftAgents.forEach(a => {
                    const dayRole = newPlanning[dateKey]['J'][a.id];
                    if (dayRole && ['CH-PL', 'AMU2-CH', 'AMU2-EQ', 'BAL1', 'BAL2'].includes(dayRole)) {
                        newPlanning[dateKey]['N'][a.id] = dayRole;
                        takenRoles.push(dayRole);
                        monthlyCounters[a.id][getFamily(dayRole)]++;
                    }
                });
            }
            rolesPrio.forEach(role => {
                if (takenRoles.includes(role)) return;
                const fam = getFamily(role);
                const isAMU1 = rolesAMU1.includes(role);
                let eligible = shiftAgents.filter(a => {
                    if (newPlanning[dateKey][shift][a.id]) return false;
                    if (a.cap.CDD && (rolesAMU1.includes(role) || rolesChauffeur.includes(role))) return false;
                    if (role === 'CDD' && !a.cap.CDD) return false;
                    if (role.includes('AMU') && !a.cap.AMU) return false;
                    if (role.includes('BAT') && !a.cap.BAT) return false;
                    if (role.includes('CH') && !a.cap.CH) return false;
                    if (role.includes('BAL') && !a.cap.BAL) return false;
                    return true;
                });
                if (eligible.length > 0) {
                    eligible.sort((a, b) => {
                        if (isAMU1 && a.isPro !== b.isPro) return a.isPro ? 1 : -1;
                        let diffM = monthlyCounters[a.id][fam] - monthlyCounters[b.id][fam];
                        if (diffM !== 0) return diffM;
                        const histA = currentHistory[a.id] || [], histB = currentHistory[b.id] || [];
                        const lastA = histA.lastIndexOf(fam), lastB = histB.lastIndexOf(fam);
                        if (lastA !== lastB) return lastA - lastB;
                        return (state.counters[a.id]?.[fam] || 0) - (state.counters[b.id]?.[fam] || 0);
                    });
                    const selected = eligible[0];
                    newPlanning[dateKey][shift][selected.id] = role;
                    takenRoles.push(role);
                    monthlyCounters[selected.id][fam]++;
                }
            });
            let polyIdx = 1;
            shiftAgents.forEach(a => { if (!newPlanning[dateKey][shift][a.id]) newPlanning[dateKey][shift][a.id] = `Polyvalent ${polyIdx++}`; });
        });
    });
    state.planning = newPlanning;
    recalculateCountersFromDraft();
    document.getElementById('result-container').classList.remove('hidden');
    renderResult();
}

function recalculateCountersFromDraft() {
    let temp = {};
    state.agents.forEach(a => { temp[a.id] = JSON.parse(JSON.stringify(state.counters[a.id] || { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 })); });
    state.dates.forEach(d => {
        const iso = d.toISOString();
        ['J', 'N'].forEach(shift => {
            state.agents.forEach(a => {
                const family = getFamily(state.planning[iso][shift][a.id]);
                if (family) temp[a.id][family]++;
            });
        });
    });
    state.proposedCounters = temp;
}

async function confirmPlanning() {
    state.counters = state.proposedCounters;
    state.dates.forEach(d => {
        const iso = d.toISOString();
        state.agents.forEach(a => {
            const fam = getFamily(state.planning[iso]['N'][a.id]) || getFamily(state.planning[iso]['J'][a.id]);
            if(fam) {
                if(!state.roleHistory[a.id]) state.roleHistory[a.id] = [];
                state.roleHistory[a.id].push(fam);
                if(state.roleHistory[a.id].length > MEMORY_DEPTH) state.roleHistory[a.id].shift();
            }
        });
    });
    await saveData();
    alert("Planification synchronisée sur le Cloud !");
}

function changeMonth() { state.month = document.getElementById('month-input').value; state.presences = {}; updateDates(); saveData(); }
function updateDates() { const p = state.month.split('-'); state.dates = getGardeDates(parseInt(p[0]), parseInt(p[1]) - 1); renderPointage(); }

function renderPointage() {
    let thead1 = `<tr><th class="sticky-col w-64">Agent</th>`, thead2 = `<tr><th class="sticky-col"></th>`;
    state.dates.forEach(d => {
        thead1 += `<th colspan="2" class="border-l border-gray-600">${d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'})}</th>`;
        thead2 += `<th class="w-10 text-[10px] bg-gray-700">J</th><th class="w-10 text-[10px] bg-gray-600">N</th>`;
    });
    document.getElementById('thead-pointage').innerHTML = thead1 + "</tr>" + thead2 + "</tr>";
    let tbody = "";
    state.agents.forEach(agent => {
        tbody += `<tr><td class="sticky-col font-bold border-r border-black"><div class="flex gap-1 float-left mr-2"><button onclick="toggleLine('${agent.id}', true)" class="text-green-600">+</button><button onclick="toggleLine('${agent.id}', false)" class="text-red-600">-</button></div>${agent.name}</td>`;
        state.dates.forEach(d => {
            const iso = d.toISOString();
            tbody += `<td class="cursor-pointer" onclick="toggleCell('${agent.id}', '${iso}', 'J')"><input type="checkbox" ${state.presences[`${agent.id}_${iso}_J`] ? "checked":""} class="pointer-events-none"></td><td class="cursor-pointer bg-gray-50" onclick="toggleCell('${agent.id}', '${iso}', 'N')"><input type="checkbox" ${state.presences[`${agent.id}_${iso}_N`] ? "checked":""} class="pointer-events-none"></td>`;
        });
        tbody += `</tr>`;
    });
    document.getElementById('tbody-pointage').innerHTML = tbody;
}

function toggleLine(id, val) { state.dates.forEach(d => { state.presences[`${id}_${d.toISOString()}_J`] = val; state.presences[`${id}_${d.toISOString()}_N`] = val; }); renderPointage(); saveData(); }
function toggleCell(id, iso, s) { const k = `${id}_${iso}_${s}`; state.presences[k] = !state.presences[k]; renderPointage(); saveData(); }

function renderResult() {
    let thead = `<tr><th class="sticky-col w-48">Agent</th>`;
    state.dates.forEach(d => thead += `<th colspan="2" class="border-l border-gray-600">${d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'})}</th>`);
    document.getElementById('thead-resultat').innerHTML = thead + "</tr>";
    let tbody = "";
    state.agents.forEach(a => {
        if(!state.dates.some(d => state.presences[`${a.id}_${d.toISOString()}_J`] || state.presences[`${a.id}_${d.toISOString()}_N`])) return;
        tbody += `<tr><td class="sticky-col font-bold border-r border-black">${a.name}</td>`;
        state.dates.forEach(d => {
            ['J', 'N'].forEach(s => {
                const r = (state.planning && state.planning[d.toISOString()] && state.planning[d.toISOString()][s]) ? state.planning[d.toISOString()][s][a.id] : "-";
                if(!state.presences[`${a.id}_${d.toISOString()}_${s}`]) tbody += `<td class="bg-gray-200">-</td>`;
                else tbody += `<td class="p-0"><select class="role-select ${getRoleColorClass(r)}" onchange="state.planning['${d.toISOString()}']['${s}']['${a.id}']=this.value;recalculateCountersFromDraft();renderResult();">
                    ${allRoles.map(opt => `<option value="${opt}" ${opt===r?'selected':''}>${opt}</option>`).join('')}</select></td>`;
            });
        });
        tbody += `</tr>`;
    });
    document.getElementById('tbody-resultat').innerHTML = tbody;
}

function renderAgents() {
    let tbody = "";
    state.agents.forEach(a => {
        const c = state.counters[a.id] || { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 };
        tbody += `<tr><td class="sticky-col p-2 border-r border-black"><input type="text" value="${a.name}" onchange="a.name=this.value;saveData();" class="w-full bg-transparent font-bold outline-none"></td><td class="text-xs font-bold">${a.isPro ? 'PRO' : 'VOL'}</td><td class="text-[10px]"><input type="checkbox" ${a.cap.CDD?'checked':''} onchange="a.cap.CDD=this.checked;saveData();"> CDD | <input type="checkbox" ${a.cap.AMU?'checked':''} onchange="a.cap.AMU=this.checked;saveData();"> AMU | <input type="checkbox" ${a.cap.BAT?'checked':''} onchange="a.cap.BAT=this.checked;saveData();"> BAT | <input type="checkbox" ${a.cap.CH?'checked':''} onchange="a.cap.CH=this.checked;saveData();"> CH | <input type="checkbox" ${a.cap.BAL?'checked':''} onchange="a.cap.BAL=this.checked;saveData();"> BAL</td><td class="bg-yellow-50 font-bold">${c.AMU}</td><td class="bg-blue-50 font-bold">${c.BAT}</td><td class="bg-orange-50 font-bold">${c.CH}</td><td class="bg-green-50 font-bold">${c.BAL}</td><td class="text-[10px] text-gray-500 italic max-w-xs truncate">${(state.roleHistory[a.id] || []).join('→')}</td><td>${!a.isPro ? `<button onclick="deleteAgent('${a.id}')" class="text-red-600 font-bold">X</button>` : ''}</td></tr>`;
    });
    document.getElementById('tbody-agents').innerHTML = tbody;
}

function addVolontaire() { const id = 'v'+Date.now(); state.agents.push({ id, name: "Nouveau", isPro: false, cap: { CDD:false, AMU:true, BAT:true, CH:false, BAL:false } }); state.counters[id] = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 }; state.roleHistory[id] = []; saveData(); renderAgents(); }
function deleteAgent(id) { if(confirm("Supprimer ?")) { state.agents = state.agents.filter(a => a.id !== id); saveData(); renderAgents(); } }
function resetCounters() { if(confirm("RAZ ?")) { state.agents.forEach(a => { state.counters[a.id] = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 }; state.roleHistory[a.id] = []; }); saveData(); renderAgents(); } }

function switchTab(t) {
    document.getElementById('view-planning').classList.toggle('hidden', t !== 'planning');
    document.getElementById('view-agents').classList.toggle('hidden', t !== 'agents');
    document.getElementById('btn-tab-planning').classList.toggle('active', t === 'planning');
    document.getElementById('btn-tab-agents').classList.toggle('active', t === 'agents');
    if(t === 'agents') renderAgents();
}

function exportCSV() {
    let csv = "\uFEFFAgent;";
    state.dates.forEach(d => { const s = d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'}); csv += `${s} J;${s} N;`; });
    csv += "\r\n";
    state.agents.forEach(a => {
        if(!state.dates.some(d => state.presences[`${a.id}_${d.toISOString()}_J`] || state.presences[`${a.id}_${d.toISOString()}_N`])) return;
        csv += `"${a.name}";`;
        state.dates.forEach(d => csv += `"${state.planning[d.toISOString()]['J'][a.id] || '-'}";"${state.planning[d.toISOString()]['N'][a.id] || '-'}";`);
        csv += "\r\n";
    });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    link.download = `Planning_B_${state.month}.csv`;
    link.click();
}

window.onload = loadData;
</script>
</body>
</html>
