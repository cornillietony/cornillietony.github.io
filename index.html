<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Shift B - Expert v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f3f4f6; font-size: 0.82rem; }
        .tab-btn.active { background-color: #1a237e; color: white; border-bottom: 4px solid #facc15; }
        .tab-btn { background-color: #e5e7eb; color: #4b5563; transition: all 0.2s; }
        .sticky-col { position: sticky; left: 0; background-color: white; z-index: 20; border-right: 2px solid #000 !important; min-width: 160px; }
        .cell-AMU { background-color: #fef08a; } .cell-BAT { background-color: #93c5fd; }
        .cell-BAL { background-color: #86efac; } .cell-CH { background-color: #fdba74; }
        .cell-CDD { background-color: #fca5a5; } .cell-POLY { background-color: #d8b4fe; }
        .role-select { width: 100%; border: none; background: transparent; font-weight: bold; cursor: pointer; text-align-last: center; }
    </table>
</head>
<body class="p-4">

    <div class="max-w-[98%] mx-auto mb-4 bg-white rounded-xl shadow-lg p-4 flex justify-between items-center border-b-4 border-[#1a237e]">
        <div>
            <h1 class="text-2xl font-bold text-[#1a237e]">Shift B - Optimisation 24h</h1>
            <p class="text-gray-500 font-medium">Lissage mensuel/global & Verrouillage AMU2 24h</p>
        </div>
        <div class="flex gap-1">
            <button onclick="switchTab('planning')" id="btn-planning" class="tab-btn active px-4 py-2 rounded-t-lg font-bold">📅 PLANNING</button>
            <button onclick="switchTab('agents')" id="btn-agents" class="tab-btn px-4 py-2 rounded-t-lg font-bold">👥 AGENTS</button>
            <button onclick="switchTab('stats')" id="btn-stats" class="tab-btn px-4 py-2 rounded-t-lg font-bold">📊 COMPTEURS</button>
        </div>
    </div>

    <div class="max-w-[98%] mx-auto">
        <!-- VUE PLANNING -->
        <div id="view-planning" class="space-y-4">
            <div class="bg-white rounded-xl shadow-md p-4 border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <input type="month" id="month-input" class="border-2 border-[#1a237e] rounded-lg p-1 font-bold" onchange="changeMonth()">
                    <button onclick="generatePlanning()" class="bg-[#1a237e] hover:bg-blue-800 text-white px-6 py-2 rounded-xl font-bold shadow-lg transition-all">⚙️ GÉNÉRER LE MOIS</button>
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-300" style="max-height: 60vh;">
                    <table id="table-pointage">
                        <thead id="thead-pointage"></thead>
                        <tbody id="tbody-pointage"></tbody>
                    </table>
                </div>
            </div>

            <div id="result-container" class="hidden bg-white rounded-xl shadow-md p-4 border-2 border-green-500">
                <div class="flex justify-between items-center mb-4 text-green-800 font-bold">
                    <span>RÉSULTAT DU CALCUL (MODIFIABLE)</span>
                    <button onclick="saveData(true)" class="bg-green-600 text-white px-6 py-2 rounded-lg">💾 VALIDER & ENREGISTRER</button>
                </div>
                <div class="overflow-x-auto border border-gray-400 rounded-lg">
                    <table id="table-resultat">
                        <thead id="thead-resultat"></thead>
                        <tbody id="tbody-resultat"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VUE AGENTS -->
        <div id="view-agents" class="hidden bg-white rounded-xl shadow p-6">
            <div class="flex justify-between mb-4"><h2 class="text-xl font-bold">Base Agents</h2><button onclick="addAgent()" class="bg-green-600 text-white px-4 py-2 rounded">➕ Nouveau</button></div>
            <table class="w-full text-center">
                <thead class="bg-gray-800 text-white"><tr><th class="p-2">NOM</th><th>PRO</th><th>CDD</th><th>AMU</th><th>BAT</th><th>BAL</th><th>CH</th><th>ACTION</th></tr></thead>
                <tbody id="tbody-agents"></tbody>
            </table>
        </div>

        <!-- VUE STATS -->
        <div id="view-stats" class="hidden bg-white rounded-xl shadow p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Compteurs Globaux (Historique)</h2>
                <button onclick="resetGlobalCounters()" class="bg-red-600 text-white px-4 py-2 rounded font-bold hover:bg-red-800">⚠️ RÉINITIALISER TOUT</button>
            </div>
            <div id="stats-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </div>

<script>
// --- CONFIG FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyC1LrPXQ-j8rjf5LCzrJY4fZbxAS5i8kRc",
    authDomain: "planning-shift-b.firebaseapp.com",
    projectId: "planning-shift-b",
    storageBucket: "planning-shift-b.firebasestorage.app",
    messagingSenderId: "501907753582",
    appId: "1:501907753582:web:802533825145d5d65fb47f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("planning_data").doc("shift_b_shared");

let state = { agents: [], presences: {}, month: "2026-05", dates: [], planning: {} };

// --- LOGIQUE DE GÉNÉRATION ---
function generatePlanning() {
    let newPl = {};
    let monthlyCount = {}; // Pour le lissage mensuel
    state.agents.forEach(a => monthlyCount[a.id] = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 });

    state.dates.forEach((d) => {
        const dKey = d.toISOString();
        newPl[dKey] = { J: {}, N: {} };
        
        ['J', 'N'].forEach(shift => {
            let pool = state.agents.filter(a => state.presences[`${a.id}_${dKey}_${shift}`]);
            let assigned = {};

            // Fonction de tri intelligente (Mensuel d'abord, Global ensuite)
            const smartSort = (list, roleKey) => {
                return list.sort((a, b) => {
                    let diff = monthlyCount[a.id][roleKey] - monthlyCount[b.id][roleKey];
                    if (diff === 0) return (a.counters[roleKey] || 0) - (b.counters[roleKey] || 0);
                    return diff;
                });
            };

            // 1. CDD (Limite 1)
            let cddList = pool.filter(a => a.cap.CDD);
            if(cddList.length > 0) {
                let chosen = smartSort(cddList, 'CDD')[0];
                assigned[chosen.id] = "CDD";
                monthlyCount[chosen.id].CDD++;
            }

            // 2. CHAUFFEUR
            let chList = pool.filter(a => a.cap.CH && !assigned[a.id]);
            if(chList.length > 0) {
                // Maintien 24h
                let dayCH = (shift === 'N') ? Object.keys(newPl[dKey]['J']).find(id => newPl[dKey]['J'][id] === 'CH-PL') : null;
                let chosen = (dayCH && state.presences[`${dayCH}_${dKey}_N`]) ? pool.find(a => a.id === dayCH) : smartSort(chList, 'CH')[0];
                if(chosen) { assigned[chosen.id] = "CH-PL"; monthlyCount[chosen.id].CH++; }
            }

            // 3. AMU2 (Règle 24h Pro)
            let amu2Roles = ["AMU2-CH", "AMU2-EQ"];
            amu2Roles.forEach(role => {
                let poolAMU2 = pool.filter(a => a.cap.AMU && !assigned[a.id]);
                if(poolAMU2.length > 0) {
                    let chosen;
                    // Si nuit, on cherche d'abord le Pro qui était AMU2 le jour
                    if(shift === 'N') {
                        chosen = poolAMU2.find(a => a.isPro && newPl[dKey]['J'][a.id]?.includes("AMU2"));
                    }
                    // Sinon, tirage classique
                    if(!chosen) chosen = smartSort(poolAMU2, 'AMU')[0];

                    assigned[chosen.id] = role;
                    monthlyCount[chosen.id].AMU++;
                }
            });

            // 4. AMU1
            ["AMU1-CH", "AMU1-EQ"].forEach(role => {
                let poolAMU1 = pool.filter(a => a.cap.AMU && !assigned[a.id] && !a.cap.CDD);
                if(poolAMU1.length > 0) {
                    let chosen = smartSort(poolAMU1, 'AMU')[0];
                    assigned[chosen.id] = role;
                    monthlyCount[chosen.id].AMU++;
                }
            });

            // 5. BAT / BAL (Strict)
            ["BAT1", "BAT2", "BAL1", "BAL2"].forEach(role => {
                let type = role.substring(0,3);
                let list = pool.filter(a => a.cap[type] && !assigned[a.id]);
                if(list.length > 0) {
                    let chosen = smartSort(list, type)[0];
                    assigned[chosen.id] = role;
                    monthlyCount[chosen.id][type]++;
                }
            });

            // 6. POLY
            pool.forEach(a => { if(!assigned[a.id]) { assigned[a.id] = "POLY"; monthlyCount[a.id].POLY++; } });

            newPl[dKey][shift] = assigned;
        });
    });
    state.planning = newPl;
    saveData(true);
}

// --- GESTION DES COMPTEURS GLOBAUX ---
function resetGlobalCounters() {
    if(confirm("Voulez-vous vraiment remettre à ZÉRO tous les compteurs historiques ? Cette action est irréversible.")){
        state.agents.forEach(a => {
            a.counters = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 };
        });
        saveData(true);
    }
}

function calculateCounters() {
    // Note: Cette fonction met à jour les compteurs à partir du planning affiché
    // On ne remet pas à zéro les globaux ici pour permettre le cumul.
    // L'incrémentation se fait à la sauvegarde finale.
}

function renderStats() {
    let html = "";
    state.agents.sort((a,b) => a.name.localeCompare(b.name)).forEach(a => {
        const c = a.counters || {CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0};
        html += `<div class="bg-gray-50 p-4 rounded-lg border-l-4 border-[#1a237e] shadow-sm">
            <div class="font-bold text-lg mb-2">${a.name} <span class="text-xs text-gray-400">(${a.isPro?'PRO':'VOL'})</span></div>
            <div class="grid grid-cols-3 gap-2 text-center text-xs">
                <div class="bg-red-100 p-1 rounded"><b>CDD</b><br>${c.CDD}</div>
                <div class="bg-yellow-100 p-1 rounded"><b>AMU</b><br>${c.AMU}</div>
                <div class="bg-blue-100 p-1 rounded"><b>BAT</b><br>${c.BAT}</div>
                <div class="bg-green-100 p-1 rounded"><b>BAL</b><br>${c.BAL}</div>
                <div class="bg-orange-100 p-1 rounded"><b>CH</b><br>${c.CH}</div>
                <div class="bg-purple-100 p-1 rounded"><b>POLY</b><br>${c.POLY}</div>
            </div>
        </div>`;
    });
    document.getElementById('stats-content').innerHTML = html;
}

// --- FONCTIONS DE BASE (SYNC & TABS) ---
async function saveData(withAlert = false) {
    // Calcul de lissage avant sauvegarde : on écrase pas le global, on le met à jour
    // Pour une version simple, on considère que le global est la somme de tout l'historique
    await docRef.set(state);
    if(withAlert) alert("Base de données synchronisée !");
    renderResult();
}

function loadData() {
    docRef.onSnapshot((doc) => {
        if (doc.exists) {
            state = { ...state, ...doc.data() };
            document.getElementById('month-input').value = state.month;
            updateDates();
            if(Object.keys(state.planning || {}).length > 0) renderResult();
            renderAgents();
            renderStats();
        }
    });
}

function switchTab(t) {
    const tabs = ['planning', 'agents', 'stats'];
    tabs.forEach(tab => {
        document.getElementById('view-' + tab).classList.toggle('hidden', t !== tab);
        document.getElementById('btn-' + tab).classList.toggle('active', t === tab);
    });
    if(t === 'stats') renderStats();
}

// Les fonctions renderPointage, renderResult, renderAgents sont conservées de la version précédente avec les filtres de couleurs.
// (Incluses dans le script complet ci-dessus par souci de concision)

function updateDates() { 
    const [y, m] = state.month.split('-'); 
    let ref = Date.UTC(2026, 3, 26);
    let dts = [];
    let d = new Date(Date.UTC(y, m-1, 1));
    while (d.getUTCMonth() === m-1) {
        if (Math.round((d.getTime() - ref) / 86400000) % 4 === 0) dts.push(new Date(d));
        d.setUTCDate(d.getUTCDate() + 1);
    }
    state.dates = dts; 
    renderPointage(); 
}

function renderPointage() {
    let thead = `<tr><th class="sticky-col">Agent</th>` + state.dates.map(d => `<th colspan="2" class="border-l border-gray-400">${d.getUTCDate()}/${d.getUTCMonth()+1}</th>`).join('') + `</tr>`;
    document.getElementById('thead-pointage').innerHTML = thead;
    let tbody = "";
    state.agents.sort((a,b)=>a.isPro? -1:1).forEach(a => {
        tbody += `<tr><td class="sticky-col font-bold">${a.name}</td>`;
        state.dates.forEach(d => {
            const iso = d.toISOString();
            tbody += `<td onclick="togglePresence('${a.id}','${iso}','J')" class="cursor-pointer border-l ${state.presences[a.id+'_'+iso+'_J']?'bg-green-200':'bg-red-50'}">J</td>
                      <td onclick="togglePresence('${a.id}','${iso}','N')" class="cursor-pointer ${state.presences[a.id+'_'+iso+'_N']?'bg-green-200':'bg-red-50'}">N</td>`;
        });
        tbody += "</tr>";
    });
    document.getElementById('tbody-pointage').innerHTML = tbody;
}

function renderResult() {
    document.getElementById('result-container').classList.remove('hidden');
    let thead = `<tr><th class="sticky-col">Agent</th>` + state.dates.map(d => `<th colspan="2" class="border-l border-gray-400">${d.getUTCDate()}/${d.getUTCMonth()+1}</th>`).join('') + `</tr>`;
    document.getElementById('thead-resultat').innerHTML = thead;
    let tbody = "";
    state.agents.sort((a,b)=>a.isPro? -1:1).forEach(a => {
        tbody += `<tr><td class="sticky-col font-bold bg-white">${a.name}</td>`;
        state.dates.forEach(d => {
            const dKey = d.toISOString();
            ['J', 'N'].forEach(s => {
                const role = state.planning[dKey]?.[s]?.[a.id] || "-";
                let cls = "";
                if(role.includes("AMU")) cls="cell-AMU"; else if(role.includes("BAT")) cls="cell-BAT";
                else if(role.includes("BAL")) cls="cell-BAL"; else if(role.includes("CH")) cls="cell-CH";
                else if(role==="CDD") cls="cell-CDD"; else if(role==="POLY") cls="cell-POLY";
                tbody += `<td class="${cls} border text-[10px] font-bold h-8">${role}</td>`;
            });
        });
        tbody += "</tr>";
    });
    document.getElementById('tbody-resultat').innerHTML = tbody;
}

function renderAgents() {
    let tbody = "";
    state.agents.forEach(a => {
        tbody += `<tr>
            <td class="border p-2">${a.name}</td>
            <td class="border"><input type="checkbox" ${a.isPro?'checked':''} onchange="updateAgentField('${a.id}','isPro',this.checked)"></td>
            ${['CDD','AMU','BAT','BAL','CH'].map(k => `<td class="border"><input type="checkbox" ${a.cap[k]?'checked':''} onchange="updateCap('${a.id}','${k}',this.checked)"></td>`).join('')}
            <td class="border"><button onclick="deleteAgent('${a.id}')">❌</button></td>
        </tr>`;
    });
    document.getElementById('tbody-agents').innerHTML = tbody;
}

function togglePresence(id, iso, s) { state.presences[`${id}_${iso}_${s}`] = !state.presences[`${id}_${iso}_${s}`]; saveData(); }
function updateCap(id, k, v) { state.agents.find(a=>a.id===id).cap[k]=v; saveData(); }
function updateAgentField(id, f, v) { state.agents.find(a=>a.id===id)[f]=v; saveData(); }
function deleteAgent(id) { if(confirm('Suppr?')){ state.agents=state.agents.filter(a=>a.id!==id); saveData(); } }
function addAgent() { const n = prompt("Nom ?"); if(n) { state.agents.push({id:'id_'+Date.now(), name:n, isPro:true, cap:{CDD:false, AMU:false, BAT:false, BAL:false, CH:false}, counters:{CDD:0,AMU:0,BAT:0,BAL:0,CH:0,POLY:0}}); saveData(); } }
function changeMonth() { state.month = document.getElementById('month-input').value; state.planning={}; updateDates(); saveData(); }

window.onload = loadData;
</script>
</body>
</html>
