<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Shift B - V2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { background-color: #f3f4f6; font-family: system-ui, sans-serif; font-size: 0.82rem; }
        .tab-btn.active { background-color: #1a237e; color: white; border-bottom: 4px solid #facc15; }
        .tab-btn { background-color: #e5e7eb; color: #4b5563; transition: all 0.2s; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; text-align: center; }
        th, td { border: 1px solid #d1d5db; padding: 4px; position: relative; }
        
        .sticky-col { position: sticky; left: 0; background-color: white; z-index: 20; text-align: left; border-right: 2px solid #000 !important; min-width: 170px; }
        
        /* Couleurs des cellules */
        .cell-AMU { background-color: #fef08a; color: #854d0e; } 
        .cell-BAT { background-color: #93c5fd; color: #1e3a8a; }
        .cell-BAL { background-color: #86efac; color: #064e3b; } 
        .cell-CH { background-color: #fdba74; color: #7c2d12; }
        .cell-CDD { background-color: #fca5a5; color: #7f1d1d; } 
        .cell-POLY { background-color: #d8b4fe; color: #581c87; }
        
        .role-select { width: 100%; border: none; background: transparent; font-weight: bold; cursor: pointer; -webkit-appearance: none; text-align: center; }

        /* Effet Crosshair (Surlignage) */
        tr:hover td { background-color: #f0f9ff !important; }
        td:hover::after, th:hover::after {
            content: ""; position: absolute; background-color: rgba(26, 35, 126, 0.05);
            left: 0; right: 0; top: -5000px; bottom: -5000px; z-index: -1; pointer-events: none;
        }

        @media print {
            .no-print { display: none !important; }
            .sticky-col { position: static !important; border-right: 1px solid #d1d5db !important; }
        }
    </style>
</head>
<body class="p-4">

    <!-- Header & Navigation -->
    <div class="max-w-[98%] mx-auto mb-6 bg-white rounded-xl shadow-lg p-4 flex justify-between items-center border-b-4 border-[#1a237e] no-print">
        <div>
            <h1 class="text-2xl font-bold text-[#1a237e]">Planning Shift B 🚒</h1>
            <p class="text-gray-500 font-medium italic">Version 2.1 - Compteurs Persistants & Visibilité</p>
        </div>
        <div class="flex gap-1">
            <button onclick="switchTab('planning')" id="btn-tab-planning" class="tab-btn active px-4 py-2 rounded-t-lg font-bold text-xs uppercase">📅 Planning</button>
            <button onclick="switchTab('agents')" id="btn-tab-agents" class="tab-btn px-4 py-2 rounded-t-lg font-bold text-xs uppercase">👥 Agents</button>
            <button onclick="switchTab('stats')" id="btn-tab-stats" class="tab-btn px-4 py-2 rounded-t-lg font-bold text-xs uppercase text-blue-700">📊 Statistiques</button>
        </div>
    </div>

    <div class="max-w-[98%] mx-auto">
        <!-- VUE PLANNING -->
        <div id="view-planning" class="space-y-6">
            <div class="bg-white rounded-xl shadow-md p-4 border border-gray-200 no-print">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">1️⃣ Présences du mois</h2>
                    <input type="month" id="month-input" class="border-2 border-[#1a237e] rounded-lg p-2 font-bold" onchange="changeMonth()">
                </div>
                <div class="overflow-x-auto rounded-lg border border-gray-300" style="max-height: 50vh;">
                    <table id="table-pointage">
                        <thead id="thead-pointage"></thead>
                        <tbody id="tbody-pointage"></tbody>
                        <tfoot id="tfoot-pointage" class="bg-gray-800 text-white font-bold"></tfoot>
                    </table>
                </div>
                <div class="mt-4 flex justify-end gap-2">
                    <button onclick="generatePlanning()" class="bg-[#1a237e] hover:bg-blue-800 text-white px-6 py-2 rounded-xl font-bold shadow-lg transition-all transform hover:scale-105">⚙️ GÉNÉRER LE PLANNING</button>
                </div>
            </div>

            <div id="result-container" class="hidden bg-white rounded-xl shadow-md p-4 border-2 border-green-500">
                <div class="flex justify-between items-center mb-4 no-print">
                    <h2 class="text-lg font-bold text-gray-800">2️⃣ Résultat Final</h2>
                    <div class="flex gap-2">
                        <button onclick="exportToExcel()" class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded-lg font-bold shadow flex items-center gap-2">EXCEL</button>
                        <button onclick="window.print()" class="bg-gray-600 text-white px-4 py-2 rounded-lg font-bold">🖨️ PDF</button>
                        <button onclick="saveData(true)" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold shadow">💾 SAUVEGARDER</button>
                    </div>
                </div>
                <div class="overflow-x-auto border border-gray-400 rounded-lg">
                    <table id="table-resultat">
                        <thead id="thead-resultat"></thead>
                        <tbody id="tbody-resultat"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VUE AGENTS (Identique mais ordonnée) -->
        <div id="view-agents" class="hidden bg-white rounded-xl shadow-md p-6 border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Paramétrage des Agents</h2>
                <button onclick="addAgent()" class="bg-green-600 text-white px-5 py-2 rounded-lg shadow font-bold">➕ Ajouter</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-800 text-white text-[10px]">
                            <th class="p-2 sticky-col">NOM</th><th>STATUT</th><th>CDD</th><th>AMU</th><th>BAT</th><th>BAL</th><th>CH</th><th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-agents"></tbody>
                </table>
            </div>
        </div>

        <!-- VUE STATS -->
        <div id="view-stats" class="hidden space-y-6">
            <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-bold text-[#1a237e]">📊 Compteurs Globaux</h2>
                    <button onclick="resetAllCounters()" class="bg-red-50 text-red-700 border px-4 py-2 rounded-lg font-bold hover:bg-red-700 hover:text-white">🔄 RÉINITIALISER</button>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-8" id="stats-summary-grid"></div>
                <div class="overflow-x-auto border rounded-xl">
                    <table class="min-w-full">
                        <thead>
                            <tr class="bg-gray-50 text-[10px]">
                                <th class="p-3 text-left sticky-col">AGENT</th><th>CDD</th><th>AMU</th><th>BAT</th><th>BAL</th><th>CH</th><th>POLY</th><th class="bg-gray-100">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-stats-global"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
// --- CONFIG FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyC1LrPXQ-j8rjf5LCzrJY4fZbxAS5i8kRc",
    authDomain: "planning-shift-b.firebaseapp.com",
    projectId: "planning-shift-b",
    storageBucket: "planning-shift-b.firebasestorage.app",
    messagingSenderId: "501907753582",
    appId: "1:501907753582:web:802533825145d5d65fb47f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// Utilisation d'un document par mois pour l'historique
const getDocRef = (m) => db.collection("planning_data").doc(`shift_b_${m || state.month}`);

const rolesListe = ["-", "CDD", "CH-PL", "AMU1-CH", "AMU1-EQ", "AMU2-CH", "AMU2-EQ", "BAT1", "BAT2", "BAL1", "BAL2", "POLY"];
let state = { agents: [], presences: {}, month: "2026-05", dates: [], planning: {} };

// --- LOGIQUE CORE ---

function getSortedAgents() {
    return [...state.agents].sort((a, b) => {
        if (a.isPro !== b.isPro) return a.isPro ? -1 : 1;
        return a.name.localeCompare(b.name);
    });
}

function renderPointage() {
    let thead1 = `<tr><th class="sticky-col bg-gray-50">AGENT</th>`, 
        thead2 = `<tr><th class="sticky-col bg-gray-50 text-[10px] text-gray-400 italic">Clic +/- pour mois complet</th>`;
    
    let totalsJ = {}, totalsN = {};

    state.dates.forEach((d) => {
        const iso = d.toISOString();
        thead1 += `<th colspan="2" class="border-l border-gray-500">${d.getUTCDate()}/${d.getUTCMonth()+1}</th>`;
        thead2 += `<th class="text-[9px] bg-blue-900 text-white">J</th><th class="text-[9px] bg-indigo-900 text-white">N</th>`;
        
        // Calcul des totaux par colonne
        totalsJ[iso] = state.agents.filter(a => state.presences[`${a.id}_${iso}_J`]).length;
        totalsN[iso] = state.agents.filter(a => state.presences[`${a.id}_${iso}_N`]).length;
    });
    
    document.getElementById('thead-pointage').innerHTML = thead1 + "</tr>" + thead2 + "</tr>";

    let tbody = "";
    getSortedAgents().forEach(agent => {
        tbody += `<tr><td class="sticky-col font-bold border-r border-black bg-white flex justify-between items-center group">
            <span class="${agent.isPro?'text-blue-800':''}">${agent.name}</span>
            <div class="flex opacity-0 group-hover:opacity-100 transition-opacity">
                <span class="text-green-600 cursor-pointer px-1 text-lg" onclick="toggleFullMonth('${agent.id}', true)">+</span>
                <span class="text-red-600 cursor-pointer px-1 text-lg" onclick="toggleFullMonth('${agent.id}', false)">-</span>
            </div>
        </td>`;
        state.dates.forEach((d) => {
            const iso = d.toISOString();
            tbody += `<td class="cursor-pointer ${state.presences[`${agent.id}_${iso}_J`] ? 'bg-green-50':''}" onclick="togglePresence('${agent.id}', '${iso}', 'J')"><input type="checkbox" ${state.presences[`${agent.id}_${iso}_J`] ? "checked":""} class="pointer-events-none"></td>
                      <td class="cursor-pointer border-r ${state.presences[`${agent.id}_${iso}_N`] ? 'bg-green-50':''}" onclick="togglePresence('${agent.id}', '${iso}', 'N')"><input type="checkbox" ${state.presences[`${agent.id}_${iso}_N`] ? "checked":""} class="pointer-events-none"></td>`;
        });
        tbody += "</tr>";
    });
    document.getElementById('tbody-pointage').innerHTML = tbody;

    // Rendu du Footer avec les compteurs de colonne
    let tfoot = `<tr><td class="sticky-col bg-gray-800 text-white uppercase text-[10px]">Total Présents</td>`;
    state.dates.forEach(d => {
        const iso = d.toISOString();
        tfoot += `<td class="bg-blue-800">${totalsJ[iso]}</td><td class="bg-indigo-800">${totalsN[iso]}</td>`;
    });
    document.getElementById('tfoot-pointage').innerHTML = tfoot + "</tr>";
}

function generatePlanning() {
    let newPl = {};
    // Utilisation des compteurs actuels pour l'équité
    let tempCounters = {};
    state.agents.forEach(a => { 
        if(!a.counters) a.counters = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 };
        tempCounters[a.id] = { ...a.counters }; 
    });

    state.dates.forEach((d) => {
        const dKey = d.toISOString();
        newPl[dKey] = { J: {}, N: {} };
        
        ['J', 'N'].forEach(shift => {
            let pool = getSortedAgents().filter(a => state.presences[`${a.id}_${dKey}_${shift}`]);
            let assignments = {};

            // 1. CDD
            let cddCandidate = pool.find(a => a.cap.CDD);
            if(cddCandidate) { assignments[cddCandidate.id] = "CDD"; tempCounters[cddCandidate.id].CDD++; }

            // 2. CHAUFFEUR (Priorité à celui qui a le moins roulé)
            let chQualified = pool.filter(a => a.cap.CH && !assignments[a.id]);
            if(chQualified.length > 0) {
                let bestCH = chQualified.sort((a, b) => tempCounters[a.id].CH - tempCounters[b.id].CH)[0];
                assignments[bestCH.id] = "CH-PL"; tempCounters[bestCH.id].CH++;
            }

            // 3. AMU
            ["AMU1-CH", "AMU1-EQ", "AMU2-CH", "AMU2-EQ"].forEach(role => {
                let amuQualified = pool.filter(a => a.cap.AMU && !assignments[a.id] && !(role.includes("AMU1") && a.cap.CDD));
                if(amuQualified.length > 0) {
                    let best = amuQualified.sort((a, b) => tempCounters[a.id].AMU - tempCounters[b.id].AMU)[0];
                    assignments[best.id] = role; tempCounters[best.id].AMU++;
                }
            });

            // 4. BAT / BAL
            ["BAT1", "BAT2", "BAL1", "BAL2"].forEach(role => {
                let type = role.substring(0,3);
                let q = pool.filter(a => a.cap[type] && !assignments[a.id]);
                if(q.length > 0) {
                    let best = q.sort((a, b) => tempCounters[a.id][type] - tempCounters[b.id][type])[0];
                    assignments[best.id] = role; tempCounters[best.id][type]++;
                }
            });

            // 5. POLY
            pool.forEach(a => { if(!assignments[a.id]) { assignments[a.id] = "POLY"; tempCounters[a.id].POLY++; } });
            newPl[dKey][shift] = assignments;
        });
    });

    state.planning = newPl;
    // Mise à jour des compteurs définitifs dans le state
    state.agents.forEach(a => { a.counters = tempCounters[a.id]; });
    saveData(true);
}

function renderResult() {
    let thead = `<tr><th class="sticky-col bg-gray-100">Agent</th>`;
    state.dates.forEach(d => thead += `<th colspan="2" class="border-l border-gray-600">${d.getUTCDate()}/${d.getUTCMonth()+1}</th>`);
    document.getElementById('thead-resultat').innerHTML = thead + "</tr>";
    
    let tbody = "";
    getSortedAgents().forEach(a => {
        tbody += `<tr><td class="sticky-col font-bold bg-gray-50 ${a.isPro?'text-blue-800':''}">${a.name}</td>`;
        state.dates.forEach(d => {
            const dKey = d.toISOString();
            ['J', 'N'].forEach(s => {
                const role = state.planning[dKey]?.[s]?.[a.id] || "-";
                let color = "";
                if(role.includes("AMU")) color="cell-AMU"; 
                else if(role.includes("BAT")) color="cell-BAT";
                else if(role.includes("BAL")) color="cell-BAL"; 
                else if(role.includes("CH")) color="cell-CH";
                else if(role==="CDD") color="cell-CDD"; 
                else if(role==="POLY") color="cell-POLY";
                
                tbody += `<td class="${color} p-0">
                    <select class="role-select" onchange="updateManualRole('${dKey}','${s}','${a.id}',this.value)">
                        ${rolesListe.map(r => `<option value="${r}" ${role===r?'selected':''}>${r}</option>`).join('')}
                    </select>
                </td>`;
            });
        });
        tbody += `</tr>`;
    });
    document.getElementById('tbody-resultat').innerHTML = tbody;
    document.getElementById('result-container').classList.remove('hidden');
}

// Fonction pour modifier manuellement un rôle sans tout casser
function updateManualRole(dKey, shift, agentId, newRole) {
    state.planning[dKey][shift][agentId] = newRole;
    saveData();
}

// --- BOILERPLATE & FIREBASE (RESTORED & IMPROVED) ---

async function saveData(withAlert = false) {
    await getDocRef().set(state);
    if(withAlert) { renderResult(); renderStats(); alert("Données sauvegardées !"); }
}

function loadData() {
    getDocRef().onSnapshot((doc) => {
        if (doc.exists) {
            state = { ...state, ...doc.data() };
            document.getElementById('month-input').value = state.month;
            updateDates();
            if(Object.keys(state.planning || {}).length > 0) renderResult();
        }
    });
}

function updateDates() { 
    const [y, m] = state.month.split('-'); 
    let ref = Date.UTC(2026, 3, 26);
    let dts = [];
    let d = new Date(Date.UTC(y, m-1, 1));
    while (d.getUTCMonth() === m-1) {
        if (Math.round((d.getTime() - ref) / 86400000) % 4 === 0) dts.push(new Date(d));
        d.setUTCDate(d.getUTCDate() + 1);
    }
    state.dates = dts; 
    renderPointage(); 
}

function togglePresence(id, iso, s) { 
    state.presences[`${id}_${iso}_${s}`] = !state.presences[`${id}_${iso}_${s}`]; 
    saveData(); 
    renderPointage(); // Refresh pour totaux colonnes
}

function toggleFullMonth(id, val) { 
    state.dates.forEach(d => { 
        const iso = d.toISOString(); 
        state.presences[`${id}_${iso}_J`] = val; 
        state.presences[`${id}_${iso}_N`] = val; 
    }); 
    saveData(); 
    renderPointage();
}

function addAgent() { 
    const n = prompt("Nom de l'agent ?"); 
    if(n) { 
        state.agents.push({
            id:'id_'+Date.now(), 
            name:n, 
            isPro:true, 
            cap:{CDD:false, AMU:false, BAT:false, BAL:false, CH:false}, 
            counters:{CDD:0,AMU:0,BAT:0,BAL:0,CH:0,POLY:0}
        }); 
        saveData(); 
    } 
}

function deleteAgent(id) { if(confirm('Supprimer cet agent ?')){ state.agents=state.agents.filter(a=>a.id!==id); saveData(); } }
function changeMonth() { state.month = document.getElementById('month-input').value; updateDates(); }
function updateCap(id, k, v) { state.agents.find(a=>a.id===id).cap[k]=v; saveData(); }
function updateAgentField(id, f, v) { state.agents.find(a=>a.id===id)[f]=v; saveData(); }

function switchTab(t) { 
    document.getElementById('view-planning').classList.toggle('hidden', t!=='planning'); 
    document.getElementById('view-agents').classList.toggle('hidden', t!=='agents'); 
    document.getElementById('view-stats').classList.toggle('hidden', t!=='stats');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-tab-'+t).classList.add('active');
    if(t==='agents') renderAgents();
    if(t==='stats') renderStats();
}

function renderAgents() {
    let tbody = "";
    getSortedAgents().forEach(a => {
        const cap = a.cap || { CDD:false, AMU:false, BAT:false, BAL:false, CH:false };
        tbody += `<tr class="hover:bg-gray-50 text-center">
            <td class="p-2 border sticky-col bg-white font-bold ${a.isPro?'text-blue-700':''}">${a.name}</td>
            <td class="border"><select onchange="updateAgentField('${a.id}','isPro',this.value==='true')" class="text-xs p-1"><option value="true" ${a.isPro?'selected':''}>PRO</option><option value="false" ${!a.isPro?'selected':''}>VOLONTAIRE</option></select></td>
            <td class="border bg-red-50"><input type="checkbox" ${cap.CDD?'checked':''} onchange="updateCap('${a.id}','CDD',this.checked)"></td>
            <td class="border bg-yellow-50"><input type="checkbox" ${cap.AMU?'checked':''} onchange="updateCap('${a.id}','AMU',this.checked)"></td>
            <td class="border bg-blue-50"><input type="checkbox" ${cap.BAT?'checked':''} onchange="updateCap('${a.id}','BAT',this.checked)"></td>
            <td class="border bg-green-50"><input type="checkbox" ${cap.BAL?'checked':''} onchange="updateCap('${a.id}','BAL',this.checked)"></td>
            <td class="border bg-orange-50"><input type="checkbox" ${cap.CH?'checked':''} onchange="updateCap('${a.id}','CH',this.checked)"></td>
            <td class="border p-2"><button onclick="deleteAgent('${a.id}')" class="text-red-500">🗑️</button></td>
        </tr>`;
    });
    document.getElementById('tbody-agents').innerHTML = tbody;
}

function renderStats() {
    const totals = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 };
    let tableBody = "";
    getSortedAgents().forEach(a => {
        const c = a.counters || { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 };
        const sum = Object.values(c).reduce((acc, v) => acc + v, 0);
        Object.keys(totals).forEach(k => totals[k] += (c[k] || 0));
        tableBody += `<tr>
            <td class="p-3 text-left font-bold sticky-col bg-white border-r">${a.name}</td>
            <td>${c.CDD}</td><td>${c.AMU}</td><td>${c.BAT}</td><td>${c.BAL}</td><td>${c.CH}</td><td>${c.POLY}</td>
            <td class="p-2 bg-gray-800 text-white font-bold">${sum}</td>
        </tr>`;
    });
    document.getElementById('tbody-stats-global').innerHTML = tableBody;
    document.getElementById('stats-summary-grid').innerHTML = Object.entries(totals).map(([k,v]) => `
        <div class="bg-white p-3 rounded-lg border text-center"><p class="text-[10px] font-bold uppercase">${k}</p><p class="text-2xl font-black">${v}</p></div>
    `).join('');
}

function resetAllCounters() {
    if(confirm("Réinitialiser tous les compteurs ?")) {
        state.agents.forEach(a => a.counters = { CDD:0, AMU:0, BAT:0, BAL:0, CH:0, POLY:0 });
        saveData(true);
    }
}

function exportToExcel() {
    const wb = XLSX.utils.book_new();
    let planningData = [["Agent"]];
    state.dates.forEach(d => {
        let ds = d.getUTCDate() + "/" + (d.getUTCMonth()+1);
        planningData[0].push(ds + " J", ds + " N");
    });
    getSortedAgents().forEach(a => {
        let row = [a.name];
        state.dates.forEach(d => {
            const dKey = d.toISOString();
            row.push(state.planning[dKey]?.['J']?.[a.id] || "-", state.planning[dKey]?.['N']?.[a.id] || "-");
        });
        planningData.push(row);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(planningData), "Planning");
    XLSX.writeFile(wb, `Planning_ShiftB_${state.month}.xlsx`);
}

window.onload = loadData;
</script>
</body>
</html>
